        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playCrackSound() {
            const bufferSize = audioCtx.sampleRate * 0.1;
            const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
            const noise = audioCtx.createBufferSource();
            noise.buffer = buffer;
            const gain = audioCtx.createGain();
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            noise.connect(gain);
            gain.connect(audioCtx.destination);
            noise.start();
        }

        function playMagicSound() {
            const notes = [523.25, 659.25, 783.99, 1046.50];
            notes.forEach((freq, i) => {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime + i * 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime + i * 0.1);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + i * 0.1 + 0.6);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start(audioCtx.currentTime + i * 0.1);
                osc.stop(audioCtx.currentTime + i * 0.1 + 0.6);
            });
        }

        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.onresize = resize;
        resize();

        class Particle {
            constructor(x, y, color, type = 'float') {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * (type === 'float' ? 8 : 12) + 2;
                this.vx = (Math.random() - 0.5) * (type === 'float' ? 2 : 12);
                this.vy = (Math.random() - 0.5) * (type === 'float' ? 2 : 12) - (type === 'crumb' ? 0 : 4);
                this.gravity = type === 'crumb' ? 0.35 : 0.05;
                this.life = 1;
                this.decay = 0.005 + Math.random() * 0.015;
                this.type = type;
            }
            update() {
                this.vx *= 0.99;
                this.vy += this.gravity;
                this.x += this.vx;
                this.y += this.vy;
                this.life -= this.decay;
            }
            draw() {
                ctx.globalAlpha = this.life * 0.6;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        function spawnExplosion(x, y) {
            for(let i=0; i<15; i++) particles.push(new Particle(x, y, '#f3cf8c', 'crumb'));
            const colors = ['#ffb7c5', '#a7bed3', '#c6e2e9', '#fdf6f9', '#ffffff'];
            for(let i=0; i<60; i++) particles.push(new Particle(x, y, colors[Math.floor(Math.random()*colors.length)], 'confetti'));
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() > 0.97) particles.push(new Particle(Math.random()*canvas.width, Math.random()*canvas.height + canvas.height, '#fff', 'float'));
            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animate);
        }
