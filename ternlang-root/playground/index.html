<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TernGround IDE — RFI-IRFOS</title>
  <style>
    :root {
      --bg:      #0d0d0f;
      --panel:   #13131a;
      --sidebar: #181820;
      --header:  #1c1c26;
      --teal:    #00ffcc;
      --red:     #ff3366;
      --grey:    #666680;
      --border:  #25253a;
      --text:    #d8d8e8;
      --text2:   #8888a8;
      --font:    'Fira Code', 'Cascadia Code', 'Courier New', monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; }

    /* ── Toolbar ─────────────────────────────────────────── */
    #toolbar {
      height: 42px;
      background: var(--header);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 12px;
      z-index: 10;
      flex-shrink: 0;
    }
    .logo { color: var(--teal); font-weight: bold; font-size: 0.85rem; letter-spacing: 1.5px; display: flex; align-items: center; gap: 7px; }
    .logo svg { opacity: 0.85; }
    .tb-sep { width: 1px; height: 22px; background: var(--border); margin: 0 2px; }
    .tb-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text2);
      padding: 4px 12px;
      font-family: var(--font);
      font-size: 0.78rem;
      cursor: pointer;
      border-radius: 3px;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tb-btn:hover { border-color: var(--teal); color: var(--teal); }
    .tb-btn.primary { border-color: var(--teal); color: var(--teal); }
    .tb-btn.primary:hover { background: var(--teal); color: var(--bg); }
    .tb-btn:disabled { opacity: 0.35; pointer-events: none; }
    #tb-filename { font-size: 0.75rem; color: var(--text2); margin-left: auto; }

    /* ── Workspace ───────────────────────────────────────── */
    #workspace {
      display: grid;
      grid-template-columns: 240px 1fr 280px;
      height: calc(100vh - 42px - 24px);
    }

    /* ── Left: File Explorer ─────────────────────────────── */
    #explorer {
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .pane-title {
      padding: 8px 12px;
      font-size: 0.68rem;
      color: var(--text2);
      text-transform: uppercase;
      letter-spacing: 1.2px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #search-box {
      padding: 8px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #search-box input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      font-family: var(--font);
      font-size: 0.78rem;
      border-radius: 2px;
      outline: none;
    }
    #search-box input:focus { border-color: var(--teal); }
    #file-tree { flex: 1; overflow-y: auto; }
    .dir-header {
      padding: 6px 10px 4px;
      font-size: 0.7rem;
      color: var(--grey);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      display: flex;
      align-items: center;
      gap: 5px;
      cursor: pointer;
      user-select: none;
      border-top: 1px solid var(--border);
      margin-top: 2px;
    }
    .dir-header:first-child { border-top: none; margin-top: 0; }
    .dir-header:hover { color: var(--text2); }
    .dir-header .arrow { transition: transform 0.15s; }
    .dir-header.collapsed .arrow { transform: rotate(-90deg); }
    .dir-files { display: flex; flex-direction: column; }
    .dir-files.hidden { display: none; }
    .file-item {
      padding: 4px 10px 4px 22px;
      font-size: 0.78rem;
      color: #8888aa;
      cursor: pointer;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .file-item:hover { background: #1e1e2c; color: var(--text); }
    .file-item.active { color: var(--teal); background: #141420; border-left: 2px solid var(--teal); padding-left: 20px; }
    .empty-state {
      padding: 20px 12px;
      text-align: center;
      color: var(--text2);
      font-size: 0.78rem;
      line-height: 1.7;
    }
    .empty-state .hint { color: var(--teal); margin-top: 8px; font-size: 0.72rem; }

    /* ── Center: Editor ──────────────────────────────────── */
    #editor-area {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden;
    }
    #tab-bar {
      height: 32px;
      background: var(--sidebar);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: flex-end;
      flex-shrink: 0;
    }
    .tab {
      padding: 0 14px;
      height: 30px;
      display: flex;
      align-items: center;
      font-size: 0.75rem;
      color: var(--text2);
      border-right: 1px solid var(--border);
      background: var(--panel);
      cursor: default;
    }
    .tab.active { background: var(--bg); color: var(--teal); border-bottom: 2px solid var(--teal); }
    #editor {
      flex: 1;
      background: var(--bg);
      color: #d4d4d8;
      border: none;
      padding: 16px 20px;
      font-family: var(--font);
      font-size: 0.88rem;
      line-height: 1.65;
      resize: none;
      outline: none;
      caret-color: var(--teal);
      tab-size: 4;
    }

    /* ── Right: Params + Output ──────────────────────────── */
    #side-panel {
      background: var(--sidebar);
      border-left: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Params section */
    #params-section {
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
      max-height: 50%;
      overflow-y: auto;
    }
    #params-content { padding: 10px 12px; }
    .param-row { margin-bottom: 14px; }
    .param-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      color: var(--text2);
      margin-bottom: 5px;
    }
    .param-type { color: var(--grey); font-size: 0.68rem; }
    .trit-btns { display: flex; gap: 4px; }
    .trit-btn {
      flex: 1;
      padding: 4px 0;
      font-family: var(--font);
      font-size: 0.75rem;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text2);
      cursor: pointer;
      border-radius: 2px;
      transition: all 0.15s;
    }
    .trit-btn:hover { border-color: var(--text2); color: var(--text); }
    .trit-btn.sel-neg { border-color: var(--red);  background: #1a0810; color: var(--red); }
    .trit-btn.sel-zer { border-color: var(--grey); background: #141420; color: #aaaacc; }
    .trit-btn.sel-pos { border-color: var(--teal); background: #001a14; color: var(--teal); }
    .num-input {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 5px 8px;
      font-family: var(--font);
      font-size: 0.8rem;
      border-radius: 2px;
      outline: none;
    }
    .num-input:focus { border-color: var(--teal); }
    .no-params { font-size: 0.75rem; color: var(--grey); font-style: italic; }

    /* Result */
    #result-section { padding: 12px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #result-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 14px;
      text-align: center;
      min-height: 70px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }
    #result-state { font-size: 1.3rem; font-weight: bold; color: var(--grey); }
    #result-code { font-size: 0.7rem; color: var(--grey); }
    #result-box.state-affirm { border-color: var(--teal); }
    #result-box.state-affirm #result-state { color: var(--teal); }
    #result-box.state-conflict { border-color: var(--red); }
    #result-box.state-conflict #result-state { color: var(--red); }
    #result-box.state-hold { border-color: #666680; }
    #result-box.state-hold #result-state { color: #9999bb; }
    #result-box.state-error { border-color: #ff6644; }
    #result-box.state-error #result-state { color: #ff6644; font-size: 0.9rem; }

    /* Output log */
    #log-section {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      min-height: 0;
    }
    #log-output {
      flex: 1;
      overflow-y: auto;
      padding: 8px 10px;
      font-size: 0.73rem;
      line-height: 1.55;
      background: #09090e;
    }
    .log-line { display: flex; gap: 7px; margin-bottom: 2px; }
    .log-time { color: #333350; flex-shrink: 0; }
    .log-sys  { color: #5555aa; font-style: italic; }
    .log-out  { color: #aaaacc; }
    .log-err  { color: #ff6644; }
    .log-affirm { color: var(--teal); }
    .log-hold   { color: #9999bb; }
    .log-reject { color: var(--red); }

    /* ── Status bar ──────────────────────────────────────── */
    #statusbar {
      height: 24px;
      background: #101018;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 16px;
      font-size: 0.68rem;
      color: var(--grey);
      flex-shrink: 0;
    }
    #statusbar span { display: flex; align-items: center; gap: 5px; }
    #status-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--grey); }
    #status-dot.ready  { background: var(--teal); }
    #status-dot.error  { background: var(--red); }
    #status-dot.running{ background: #ffcc00; }

    /* ── Scrollbars ──────────────────────────────────────── */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #2a2a42; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #40406a; }

    .hidden-input { display: none; }
  </style>
</head>
<body>

<!-- ═══ TOOLBAR ═══════════════════════════════════════════════════════════ -->
<div id="toolbar">
  <div class="logo">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>
    TernGround IDE
  </div>
  <div class="tb-sep"></div>
  <button class="tb-btn" id="btn-open" onclick="openFolder()">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
    Load .tern file
  </button>
  <button class="tb-btn primary" id="btn-run" onclick="runProgram()" disabled>
    <svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
    RUN
  </button>
  <button class="tb-btn" id="btn-clear" onclick="clearOutput()">Clear log</button>
  <div id="tb-filename" style="margin-left:auto; font-size:0.72rem; color:var(--text2);">no file open</div>
</div>

<!-- Hidden file input for folder selection -->
<input type="file" id="folder-input" class="hidden-input" webkitdirectory multiple accept=".tern" onchange="handleFolderSelect(this)">

<!-- ═══ WORKSPACE ═══════════════════════════════════════════════════════════ -->
<div id="workspace">

  <!-- LEFT: Explorer -->
  <div id="explorer">
    <div class="pane-title">Explorer</div>
    <div id="search-box">
      <input type="text" id="search" placeholder="Filter files..." oninput="filterTree(this.value)">
    </div>
    <div id="file-tree">
      <div class="empty-state" id="tree-empty" style="display:none">
        Loading stdlib...
      </div>
    </div>
  </div>

  <!-- CENTER: Editor -->
  <div id="editor-area">
    <div id="tab-bar">
      <div class="tab active" id="tab-name">untitled.tern</div>
    </div>
    <textarea id="editor" spellcheck="false" placeholder="// Open a .tern file from the explorer, or start typing here.
// Click RUN to execute with the BET interpreter.

fn gate(v: trit) -> trit {
    match v {
        -1 => { return conflict(); }
         0 => { return hold();    }
         1 => { return truth();   }
    }
}

let signal: trit = 1;
let result: trit = gate(signal);

match result {
    -1 => { return conflict(); }
     0 => { return hold();    }
     1 => { return truth();   }
}" oninput="onEditorChange()" onkeyup="updateCursor()" onclick="updateCursor()"></textarea>
  </div>

  <!-- RIGHT: Params + Output -->
  <div id="side-panel">
    <div id="params-section">
      <div class="pane-title">Parameters</div>
      <div id="params-content">
        <div class="no-params">Run a program to see its top-level variables.</div>
      </div>
    </div>

    <div id="result-section">
      <div class="pane-title" style="padding-bottom:8px;">Result</div>
      <div id="result-box">
        <div id="result-state">AWAITING</div>
        <div id="result-code"></div>
      </div>
    </div>

    <div id="log-section">
      <div class="pane-title">Output / Log</div>
      <div id="log-output">
        <div class="log-line">
          <span class="log-time" id="init-time"></span>
          <span class="log-sys">BET interpreter ready. Open a .tern file or edit the editor and click RUN.</span>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ═══ STATUS BAR ════════════════════════════════════════════════════════ -->
<div id="statusbar">
  <span><div id="status-dot" class="ready"></div><span id="status-msg">ready</span></span>
  <span>Ln <span id="cursor-ln">1</span>, Col <span id="cursor-col">1</span></span>
  <span style="margin-left:auto;">BET VM · balanced ternary · RFI-IRFOS</span>
</div>

<script>
'use strict';

// ═══════════════════════════════════════════════════════════════════════════
// STDLIB EMBED — 25 curated files from errors/ and core/
// Regenerate: python3 playground/embed_stdlib.py
// ═══════════════════════════════════════════════════════════════════════════
const STDLIB_EMBED = {
  "errors/BET-001.tern": `// stdlib/errors/BET-001.tern
// Error: BET-001 — Stack Underflow
// Tier: 1 — Open Core
//
// "You tried to pop a truth that wasn't there.
//  The VM's stack is empty — like asking someone to give back a hug they never received."
//
// ─── What went wrong ─────────────────────────────────────────────────────────
//
// The BET VM uses an operand stack to pass values between instructions.
// Every 'return' in a function pushes a value onto the stack before TRET.
// If a code path exits without pushing a value, the VM tries to pop nothing.
//
// WRONG (will trigger BET-001 at runtime):
//
//   fn gate(v: trit) -> trit {
//       match v {
//           -1 => { return conflict(); }
//            1 => { return truth();   }
//           // 0 arm is MISSING.
//           // When v == 0 at runtime, no return executes.
//           // The function ends without pushing a value.
//           // TRET pops the stack → stack underflow → BET-001.
//       }
//   }
//
// ─── Why PARSE-004 and BET-001 are related ────────────────────────────────────
//
// PARSE-004 catches non-exhaustive match at compile time.
// BET-001 catches missing returns at runtime (when the compiler can't prove it).
//
// If you see BET-001 and NOT PARSE-004, the missing return is on a code path
// that the compiler couldn't verify statically — for example inside a loop
// or conditional that the type system couldn't evaluate.
//
// ─── The invariant ────────────────────────────────────────────────────────────
//
// Every function must push exactly one value onto the stack before TRET,
// on EVERY code path. Every match arm, every if branch, every loop exit.
//
// ─── Correct pattern ─────────────────────────────────────────────────────────

fn gate(v: trit) -> trit {
    match v {
        -1 => { return conflict(); }   // ← pushes conflict(), then TRET
         0 => { return hold();    }   // ← pushes hold(), then TRET
         1 => { return truth();   }   // ← pushes truth(), then TRET
    }
    // Every arm returns — the stack always has a value when TRET executes.
}

fn chain(a: trit, b: trit) -> trit {
    let r1: trit = gate(a);
    let r2: trit = gate(b);
    return consensus(r1, r2);
    // Exactly one value on the stack when this TRET executes.
}

let result: trit = chain(1, 0);

match result {
    -1 => { return conflict(); }
     0 => { return hold();    }
     1 => { return truth();   }
}
`,
  "errors/BET-002.tern": `// stdlib/errors/BET-002.tern
// Error: BET-002 — BET Encoding Fault
// Tier: 1 — Open Core
//
// "The 0b00 bit pattern is forbidden in balanced ternary encoding.
//  Only 01 (-1), 10 (0), and 11 (+1) exist. You found the state that shouldn't be — the void."
//
// ─── What went wrong ─────────────────────────────────────────────────────────
//
// The BET codec uses 2 bits to represent each trit:
//
//   0b01  =  -1  (reject)
//   0b10  =   0  (hold)
//   0b11  =  +1  (affirm)
//   0b00  =  ??? (FORBIDDEN — this is the void state)
//
// The 0b00 pattern has no trit value. It is the encoding equivalent of
// a null pointer — a bit combination that should never appear in a valid
// trit stream. If the VM encounters it while unpacking bytecode, BET-002 fires.
//
// ─── Who triggers this ────────────────────────────────────────────────────────
//
//   Normal .tern programs:    NEVER — the compiler only emits valid BET encodings
//   Corrupted .ternbc files:  YES — if bytes are zeroed or incorrectly patched
//   Manual bytecode authors:  YES — if 0x00 is written into a packed trit byte
//   Faulty hardware:          YES — bit flip in memory produces 0b00
//
// ─── If you see this from a .tern source file ─────────────────────────────────
//
//   1. Delete all .ternbc cache files
//   2. Recompile from source: cargo build --bin ternlang-cli
//   3. If it persists, run on different hardware (possible RAM issue)
//   4. Report as a compiler bug with the .tern source that triggers it
//
// ─── BET encoding reference ───────────────────────────────────────────────────
//
//   Each trit is packed into 2 bits. A byte holds 4 trits (8 bits / 2):
//
//   Byte: [ trit3 trit3 | trit2 trit2 | trit1 trit1 | trit0 trit0 ]
//
//   Valid byte examples:
//     0b11111111  =  +1 +1 +1 +1  (four affirm trits)
//     0b10101010  =   0  0  0  0  (four hold trits)
//     0b01010101  =  -1 -1 -1 -1  (four reject trits)
//     0b11100110  =  +1  0 -1 +1  (mixed valid)
//     0b00xxxxxx  =  INVALID (0b00 in high pair — BET-002)
//
// ─── Correct usage — always use the compiler for trit encoding ────────────────

fn encoding_demo(a: trit, b: trit, c: trit) -> trit {
    // The compiler handles all BET encoding internally.
    // Your job: use trit values. The VM's job: pack/unpack correctly.
    let merged: trit = consensus(a, b);
    return consensus(merged, c);
}

let result: trit = encoding_demo(1, 0, 1);

match result {
    -1 => { return conflict(); }
     0 => { return hold();    }
     1 => { return truth();   }
}
`,
  "errors/BET-003.tern": `// stdlib/errors/BET-003.tern
// Error: BET-003 — Clean Halt (Informational, Not An Error)
// Tier: 1 — Open Core
//
// "Execution reached the end. This is not an error — this is peace.
//  The VM executed your program completely and stopped cleanly."
//
// ─── What happened ───────────────────────────────────────────────────────────
//
// The VM encountered the THALT opcode or reached the end of the bytecode buffer
// with no pending instructions. This is the expected, successful termination
// of any Ternlang program.
//
// BET-003 appears as an informational message, not an error.
// "Program exited successfully." in the CLI output means BET-003 fired cleanly.
//
// ─── When BET-003 might be unexpected ─────────────────────────────────────────
//
// If your program halts before you expected it to, check for:
//
//   1. An early 'return' at top level that exits before your main logic runs.
//   2. A match arm that returns immediately without running the code below it.
//   3. A function body where the last statement is a 'return' that exits
//      before subsequent statements (which become dead code).
//
// ─── What a complete, clean program looks like ────────────────────────────────

fn deliberate(evidence: trit, context: trit) -> trit {
    let combined: trit = consensus(evidence, context);
    match combined {
        -1 => { return conflict(); }
         0 => { return hold();    }
         1 => { return truth();   }
    }
}

fn policy_gate(decision: trit) -> trit {
    match decision {
        -1 => { return conflict(); }   // blocked
         0 => { return hold();    }   // pending
         1 => { return truth();   }   // approved
    }
}

// Program flow: declare, compute, decide, exit.
let signal_a: trit = 1;
let signal_b: trit = 0;

let decision: trit  = deliberate(signal_a, signal_b);
let outcome:  trit  = policy_gate(decision);

// Final return — program exits cleanly after this. BET-003 fires. Good.
match outcome {
    -1 => { return conflict(); }
     0 => { return hold();    }
     1 => { return truth();   }
}

// "Program exited successfully." ← BET-003. This is the goal.
`,
  "errors/BET-004.tern": `// stdlib/errors/BET-004.tern
// Error: BET-004 — Unknown Opcode
// Tier: 1 — Open Core
//
// "The machine is reading your bytecode and hit an instruction it has never seen.
//  Delete cached .ternbc files and recompile."
//
// ─── What went wrong ─────────────────────────────────────────────────────────
//
// The VM's instruction dispatch loop encountered a byte value that is not
// defined in the BET instruction set. The BET ISA defines 51 opcodes.
// Any byte outside these defined values triggers BET-004.
//
// This is almost always caused by stale bytecode, not by your .tern source.
//
// ─── The BET ISA opcode map (reference) ──────────────────────────────────────
//
//   0x00  THALT      — clean halt (BET-003)
//   0x01  TPUSH      — push trit literal
//   0x02  TADD       — trit/int/float addition
//   0x03  TMUL       — trit/int/float multiplication
//   0x04  TNEG       — trit/int/float negation
//   0x05  TJMP_POS   — jump if top of stack is +1
//   0x06  TJMP_ZERO  — jump if top of stack is 0
//   0x07  TJMP_NEG   — jump if top of stack is -1
//   0x08  TSTORE     — store to register
//   0x09  TLOAD      — load from register
//   0x0a  TDUP       — duplicate top of stack
//   0x0b  TJMP       — unconditional jump
//   0x0c  TPOP       — discard top of stack

    if (src[i]==='-' && src[i+1]==='>') { toks.push({k:K.PT,v:'->'}); i+=2; continue; }
    // fat arrow =>
    if (src[i]==='=' && src[i+1]==='>') { toks.push({k:K.PT,v:'=>'}); i+=2; continue; }
    // 2-char ops: >= <= == !=
    const op2 = src.slice(i,i+2);
    if (['>=','<=','==','!='].includes(op2)) { toks.push({k:K.OP,v:op2}); i+=2; continue; }
    // number
    if (/[0-9]/.test(src[i])) {
      let j=i; while (j<src.length && /[0-9]/.test(src[j])) j++;
      if (src[j]==='.') { j++; while (j<src.length && /[0-9]/.test(src[j])) j++; }
      toks.push({k:K.NUM, v:src.slice(i,j)}); i=j; continue;
    }
    // identifier / keyword
    if (/[a-zA-Z_]/.test(src[i])) {
      let j=i; while (j<src.length && /\w/.test(src[j])) j++;
      const w=src.slice(i,j);
      toks.push({k:KWSET.has(w)?K.KW:K.ID, v:w}); i=j; continue;
    }
    // single-char ops (include = for assignments)
    if ('+-*/><!='.includes(src[i])) { toks.push({k:K.OP,v:src[i]}); i++; continue; }
    // punctuation
    if ('{}()[]:;,?'.includes(src[i])) { toks.push({k:K.PT,v:src[i]}); i++; continue; }
    i++; // skip unknowns
  }
  toks.push({k:K.EOF,v:''});
  return toks;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 2: PARSER → AST
// ═══════════════════════════════════════════════════════════════════════════

class ParseError extends Error { constructor(m) { super(m); this.name='ParseError'; } }

class Parser {
  constructor(toks) { this.t=toks; this.p=0; }
  peek() { return this.t[this.p]; }
  eat(k,v) {
    const tok=this.t[this.p];
    if (k && tok.k!==k) throw new ParseError(`[PARSE-002] Expected ${k} but got '${tok.v}'`);
    if (v!==undefined && tok.v!==v) throw new ParseError(`[PARSE-002] Expected '${v}' but got '${tok.v}'`);
    return this.t[this.p++];
  }
  maybeEat(k,v) {
    const tok=this.t[this.p];
    if (tok.k===k && (v===undefined||tok.v===v)) { this.p++; return tok; }
    return null;
  }

  parseProgram() {
    const stmts=[];
    while (this.peek().k!==K.EOF) stmts.push(this.parseStmt());
    return {type:'Program', stmts};
  }

  parseStmt() {
    const t=this.peek();
    if (t.k===K.KW) {
      if (t.v==='fn')     return this.parseFn();
      if (t.v==='let')    return this.parseLet();
      if (t.v==='return') return this.parseReturn();
      if (t.v==='match')  return this.parseMatch();
      if (t.v==='if')     return this.parseIf();
      if (t.v==='use')    { this.skipTo(';'); this.eat(K.PT,';'); return {type:'Noop'}; }
      if (t.v==='struct') { this.eat(K.KW); this.maybeEat(K.ID); this.skipBlock(); return {type:'Noop'}; }
      if (t.v==='agent')  { this.eat(K.KW); this.eat(K.ID); this.skipBlock(); return {type:'Noop'}; }
      if (t.v==='for')    { return this.parseFor(); }
    }
    return this.parseExprOrAssign();
  }

  skipTo(v) { while (this.peek().k!==K.EOF && this.peek().v!==v) this.p++; }
  skipBlock() {
    this.eat(K.PT,'{'); let d=1;
    while (d>0 && this.peek().k!==K.EOF) { const v=this.t[this.p++].v; if(v==='{')d++; if(v==='}')d--; }
  }

  parseFn() {
    this.eat(K.KW,'fn');
    const name=this.eat(K.ID).v;
    this.eat(K.PT,'(');
    const params=[];
    while (!(this.peek().k===K.PT && this.peek().v===')')) {
      const pn=this.eat(K.ID).v;
      this.eat(K.PT,':');
      const pt=this.parseType();
      params.push({name:pn,type:pt});
      this.maybeEat(K.PT,',');
    }
    this.eat(K.PT,')');
    this.eat(K.PT,'->');
    const ret=this.parseType();
    this.eat(K.PT,'{');
    const body=this.parseBlock();
    this.eat(K.PT,'}');
    return {type:'FnDecl',name,params,ret,body};
  }

  parseType() {
    const base=this.eat(K.ID).v;
    if (this.peek().k===K.OP && this.peek().v==='<') { // trittensor<N>
      this.eat(K.OP,'<'); this.eat(K.NUM); this.eat(K.OP,'>');
      return base+'<N>';
    }
    if (this.peek().k===K.PT && this.peek().v==='[') {
      this.eat(K.PT,'['); this.eat(K.PT,']'); return base+'[]';
    }
    return base;
  }

  parseLet() {
    this.eat(K.KW,'let');
    const name=this.eat(K.ID).v;
    this.eat(K.PT,':');
    const varType=this.parseType();
    this.eat(K.OP,'=');
    const expr=this.parseExpr();
    this.eat(K.PT,';');
    return {type:'LetDecl',name,varType,expr};
  }

  parseReturn() {
    this.eat(K.KW,'return');
    const expr=this.parseExpr();
    this.eat(K.PT,';');
    return {type:'Return',expr};
  }

  parseMatch() {
    this.eat(K.KW,'match');
    const scr=this.parseExpr();
    this.eat(K.PT,'{');
    const arms=[];
    while (!(this.peek().k===K.PT && this.peek().v==='}')) {
      let pat;
      if (this.peek().k===K.OP && this.peek().v==='-') {
        this.eat(K.OP,'-'); pat=-Number(this.eat(K.NUM).v);
      } else {
        pat=Number(this.eat(K.NUM).v);
      }
      // accept both => and = >
      if (this.peek().k===K.PT && this.peek().v==='=>') this.eat(K.PT,'=>');
      else { this.eat(K.OP,'='); this.eat(K.OP,'>'); }
      this.eat(K.PT,'{');
      const body=this.parseBlock();
      this.eat(K.PT,'}');
      arms.push({pat,body});
    }
    this.eat(K.PT,'}');
    return {type:'Match',scr,arms};
  }

  parseIf() {
    this.eat(K.KW,'if');
    const cond=this.parseExpr();
    this.eat(K.PT,'{');
    const then=this.parseBlock();
    this.eat(K.PT,'}');
    let els=null;
    if (this.peek().k===K.KW && this.peek().v==='else') {
      this.eat(K.KW,'else');
      if (this.peek().k===K.KW && this.peek().v==='if') {
        els=[this.parseIf()];
      } else {
        this.eat(K.PT,'{'); els=this.parseBlock(); this.eat(K.PT,'}');
      }
    }
    return {type:'If',cond,then,els};
  }

  parseFor() {
    this.eat(K.KW,'for');
    const var_=this.eat(K.ID).v;
    this.eat(K.KW,'in');
    const iter=this.parseExpr();
    this.eat(K.PT,'{');
    const body=this.parseBlock();
    this.eat(K.PT,'}');
    return {type:'For',var:var_,iter,body};
  }

  parseExprOrAssign() {
    const expr=this.parseExpr();
    if (this.peek().k===K.OP && this.peek().v==='=') {
      this.eat(K.OP,'=');
      const rhs=this.parseExpr();
      this.maybeEat(K.PT,';');
      return {type:'Assign',target:expr.name||'?',expr:rhs};
    }
    this.maybeEat(K.PT,';');
    return {type:'ExprStmt',expr};
  }

  parseBlock() {
    const stmts=[];
    while (!(this.peek().k===K.PT && this.peek().v==='}') && this.peek().k!==K.EOF)
      stmts.push(this.parseStmt());
    return stmts;
  }

  parseExpr()       { return this.parseCmp(); }
  parseCmp() {
    let l=this.parseAdd();
    const ops=['>=','<=','==','!=','>','<'];
    while (ops.includes(this.peek().v) && this.peek().k===K.OP) {
      const op=this.eat(K.OP).v;
      l={type:'BinOp',op,l,r:this.parseAdd()};
    }
    return l;
  }
  parseAdd() {
    let l=this.parseMul();
    while (this.peek().k===K.OP && '+-'.includes(this.peek().v)) {
      const op=this.eat(K.OP).v;
      l={type:'BinOp',op,l,r:this.parseMul()};
    }
    return l;
  }
  parseMul() {
    let l=this.parseUnary();
    while (this.peek().k===K.OP && '*/'.includes(this.peek().v)) {
      const op=this.eat(K.OP).v;
      l={type:'BinOp',op,l,r:this.parseUnary()};
    }
    return l;
  }
  parseUnary() {
    if (this.peek().k===K.OP && this.peek().v==='-') {
      this.eat(K.OP,'-');
      return {type:'Neg',expr:this.parseUnary()};
    }
    return this.parsePrimary();
  }
  parsePrimary() {
    const t=this.peek();
    // number
    if (t.k===K.NUM) {
      this.p++;
      const n=t.v.includes('.')?parseFloat(t.v):parseInt(t.v);
      return {type:'Lit',val:n,isFloat:t.v.includes('.')};
    }
    // string
    if (t.k===K.PT && t.v==='"') {
      // skip string literals (rare in our stdlib)
      this.p++;
      let s=''; while (this.peek().v!=='"') { s+=this.t[this.p++].v; }
      this.eat(K.PT,'"');
      return {type:'Lit',val:s,isStr:true};
    }
    // identifier or call
    if (t.k===K.ID) {
      this.p++;
      const name=t.v;
      if (this.peek().k===K.PT && this.peek().v==='(') {
        this.eat(K.PT,'(');
        const args=[];
        while (!(this.peek().k===K.PT && this.peek().v===')')) {
          args.push(this.parseExpr()); this.maybeEat(K.PT,',');
        }
        this.eat(K.PT,')');
        return this.parseSuffix({type:'Call',fn:name,args});
      }
      // propagation ?
      if (this.peek().k===K.PT && this.peek().v==='?') {
        this.p++; return {type:'Prop',expr:{type:'Ident',name}};
      }
      return this.parseSuffix({type:'Ident',name});
    }
    // parenthesized
    if (t.k===K.PT && t.v==='(') {
      this.eat(K.PT,'('); const e=this.parseExpr(); this.eat(K.PT,')');
      return e;
    }
    // array literal
    if (t.k===K.PT && t.v==='[') {
      this.eat(K.PT,'[');
      const items=[];
      while (!(this.peek().k===K.PT && this.peek().v===']')) {
        items.push(this.parseExpr()); this.maybeEat(K.PT,',');
      }
      this.eat(K.PT,']');
      return {type:'Arr',items};
    }
    throw new ParseError(`[PARSE-001] Unexpected token '${t.v}' (${t.k})`);
  }
  parseSuffix(e) {
    while (this.peek().k===K.PT && this.peek().v==='[') {
      this.eat(K.PT,'['); const idx=this.parseExpr(); this.eat(K.PT,']');
      e={type:'Idx',expr:e,idx};
    }
    if (this.peek().k===K.PT && this.peek().v==='?') {
      this.p++; e={type:'Prop',expr:e};
    }
    return e;
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 3: INTERPRETER / EVALUATOR
// ═══════════════════════════════════════════════════════════════════════════

class ReturnSignal { constructor(v){this.value=v;} }
class RuntimeError extends Error { constructor(m){super(m);this.name='RuntimeError';} }

class TernInterpreter {
  constructor() { this.fns={}; this.logs=[]; }

  run(source, overrides={}) {
    this.fns={}; this.logs=[];
    this._log('sys','Parsing .tern source...');
    let ast;
    try {
      const toks=tokenize(source);
      ast=new Parser(toks).parseProgram();
    } catch(e) {
      this._log('err', e.message);
      return {state:'error', code:this._code(e.message), msg:e.message};
    }
    this._log('sys','Running program...');
    const env={};
    // Collect fn declarations first
    for (const s of ast.stmts) { if (s.type==='FnDecl') this.fns[s.name]=s; }
    // Execute top-level statements
    try {
      for (const s of ast.stmts) {
        if (s.type==='FnDecl'||s.type==='Noop') continue;
        if (s.type==='LetDecl' && overrides.hasOwnProperty(s.name)) {
          env[s.name]=overrides[s.name]; continue;
        }
        const r=this._execStmt(s,env);
        if (r instanceof ReturnSignal) {
          const v=r.value;
          this._logVal(v);
          return {state:'ok', value:v};
        }
      }
      this._log('sys','Program exited successfully.');
      return {state:'ok', value:{k:'trit',v:0}};
    } catch(e) {
      if (e instanceof ReturnSignal) {
        this._logVal(e.value);
        return {state:'ok', value:e.value};
      }
      this._log('err', e.message);
      return {state:'error', code:this._code(e.message), msg:e.message};
    }
  }

  _execStmt(s, env) {
    switch(s.type) {
      case 'LetDecl': env[s.name]=this._eval(s.expr,env); return null;
      case 'Return':  return new ReturnSignal(this._eval(s.expr,env));
      case 'Assign':  env[s.target]=this._eval(s.expr,env); return null;
      case 'ExprStmt': this._eval(s.expr,env); return null;
      case 'Noop': return null;
      case 'Match': {
        const val=this._eval(s.scr,env);
        const n=this._tri(val);
        for (const arm of s.arms) {
          if (arm.pat===n) {
            const localEnv={...env};
            for (const st of arm.body) {
              const r=this._execStmt(st,localEnv);
              if (r instanceof ReturnSignal) return r;
            }
            return null;
          }
        }
        throw new RuntimeError(`[BET-001] Non-exhaustive match — no arm matched trit ${n}`);
      }
      case 'If': {
        const cond=this._eval(s.cond,env);
        const cv=this._num(cond);
        const branch=cv>0 ? s.then : (cv<0 ? s.els : null);
        if (branch) {
          for (const st of branch) {
            const r=this._execStmt(st,env);
            if (r instanceof ReturnSignal) return r;
          }
        }
        return null;
      }
      case 'For': {
        const iter=this._eval(s.iter,env);
        const arr=iter.k==='array' ? iter.v : [];
        for (const item of arr) {
          const localEnv={...env};
          localEnv[s.var]=item;
          for (const st of s.body) {
            const r=this._execStmt(st,localEnv);
            if (r instanceof ReturnSignal) return r;
          }
        }
        return null;
      }
      case 'FnDecl': return null;
    }
    return null;
  }

  _eval(e, env) {
    switch(e.type) {
      case 'Lit': return e.isFloat ? {k:'float',v:e.val} : {k:'int',v:e.val};
      case 'Ident': {
        if (e.name in env) return env[e.name];
        throw new RuntimeError(`[SCOPE-001] '${e.name}' is undefined`);
      }
      case 'Neg': { const v=this._eval(e.expr,env); return {k:v.k,v:-v.v}; }
      case 'BinOp': {
        const L=this._eval(e.l,env), R=this._eval(e.r,env);
        const lv=this._num(L), rv=this._num(R);
        switch(e.op) {
          case '+': return {k:this._nkind(L,R), v:lv+rv};
          case '-': return {k:this._nkind(L,R), v:lv-rv};
          case '*': return {k:this._nkind(L,R), v:lv*rv};
          case '/': {
            if (rv===0) throw new RuntimeError('[BET-007] Division by zero');
            return {k:this._nkind(L,R), v:lv/rv};
          }
          case '>':  return {k:'trit', v:lv>rv?1:lv===rv?0:-1};
          case '<':  return {k:'trit', v:lv<rv?1:lv===rv?0:-1};
          case '>=': return {k:'trit', v:lv>=rv?1:-1};
          case '<=': return {k:'trit', v:lv<=rv?1:-1};
          case '==': return {k:'trit', v:lv===rv?1:-1};
          case '!=': return {k:'trit', v:lv!==rv?1:-1};
        }
      }
      case 'Arr': return {k:'array', v:e.items.map(i=>this._eval(i,env))};
      case 'Idx': {
        const arr=this._eval(e.expr,env);
        const idx=this._num(this._eval(e.idx,env));
        if (!arr || arr.k!=='array') throw new RuntimeError(`[BET-009] Not an array`);
        if (idx<0||idx>=arr.v.length) throw new RuntimeError(`[BET-008] Index ${idx} out of bounds (size ${arr.v.length})`);
        return arr.v[idx];
      }
      case 'Prop': {
        const v=this._eval(e.expr,env);
        if (this._tri(v)===-1) throw new ReturnSignal({k:'trit',v:-1});
        return v;
      }
      case 'Call': {
        const args=e.args.map(a=>this._eval(a,env));
        return this._call(e.fn, args);
      }
    }
    return {k:'trit',v:0};
  }

  _call(name, args) {
    // Built-ins
    switch(name) {
      case 'truth':    return {k:'trit',v:1};
      case 'hold':     return {k:'trit',v:0};
      case 'conflict': return {k:'trit',v:-1};
      // legacy aliases (from hallucinated stdlib)
      case 'affirm': case 'Affirm': return {k:'trit',v:1};
      case 'tend':   case 'Tend':   return {k:'trit',v:0};
      case 'reject': case 'Reject': return {k:'trit',v:-1};
      case 'invert': return {k:'trit',v:-this._tri(args[0])};
      case 'consensus': case 'mul': {
        const a=this._tri(args[0]),b=this._tri(args[1]);
        if (name==='mul') return {k:'trit',v:a*b}; // TMUL
        if(a===1&&b===1)return{k:'trit',v:1};
        if(a===-1&&b===-1)return{k:'trit',v:-1};
        if(a===0)return{k:'trit',v:b};
        if(b===0)return{k:'trit',v:a};
        return{k:'trit',v:0};
      }
      case 'abs': return {k:'int',v:Math.abs(this._num(args[0]))};
      case 'min': return {k:'int',v:Math.min(this._num(args[0]),this._num(args[1]))};
      case 'max': return {k:'int',v:Math.max(this._num(args[0]),this._num(args[1]))};
      case 'print': case 'println': {
        const msg=args.map(a=>this._str(a)).join(' ');
        this._log('out', msg); return {k:'trit',v:1};
      }
      case 'shape': case 'sparsity': case 'zeros': case 'quantize': case 'matmul':
        return {k:'trit',v:1}; // stub tensor ops
    }
    // User fn
    if (!(name in this.fns)) throw new RuntimeError(`[FN-001] '${name}' is not defined`);
    const fn=this.fns[name];
    if (fn.params.length!==args.length)
      throw new RuntimeError(`[FN-003] '${name}' expects ${fn.params.length} arg(s), got ${args.length}`);
    const local={};
    fn.params.forEach((p,i)=>{ local[p.name]=args[i]; });
    try {
      for (const s of fn.body) {
        const r=this._execStmt(s,local);
        if (r instanceof ReturnSignal) return r.value;
      }
      return {k:'trit',v:0};
    } catch(e) {
      if (e instanceof ReturnSignal) return e.value;
      throw e;
    }
  }

  // Helpers
  _tri(v) { if(!v)return 0; const n=this._num(v); return n>0?1:n<0?-1:0; }
  _num(v) { if(!v)return 0; return typeof v==='object'?v.v:v; }
  _nkind(a,b) { if(a.k==='float'||b.k==='float')return'float'; return a.k||'int'; }
  _str(v) {
    if(!v)return'null';
    if(v.k==='trit')return v.v===1?'+1 (affirm)':v.v===-1?'-1 (conflict)':'0 (hold)';
    if(v.k==='array')return`[${v.v.map(x=>this._str(x)).join(', ')}]`;
    return String(v.v);
  }
  _code(m) { const c=m.match(/\[(\w+-\d+)\]/); return c?c[1]:'BET-007'; }
  _log(kind,msg) { this.logs.push({kind,msg,time:new Date()}); }
  _logVal(v) {
    const t=this._tri(v);
    const kind=t===1?'affirm':t===-1?'reject':'hold';
    this._log(kind, `Program exited: ${this._str(v)}`);
  }
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 4: PARAMETER DETECTION
// ═══════════════════════════════════════════════════════════════════════════

function detectParams(source) {
  // Find top-level let declarations (not inside fn/match/if blocks)
  // Simple approach: scan lines, track brace depth
  const params = [];
  const lines = source.split('\n');
  let depth = 0;
  for (const line of lines) {
    const trimmed = line.trim();
    // Count braces
    for (const ch of trimmed) { if(ch==='{')depth++; if(ch==='}')depth--; }
    if (depth > 0) continue; // inside a block
    // Match: let NAME : TYPE = VALUE;
    const m = trimmed.match(/^let\s+(\w+)\s*:\s*(trit|int|float)(?:\[\]|<\w+>)?\s*=\s*(.+?);/);
    if (!m) continue;
    const [, name, type, rawVal] = m;
    let defaultVal;
    if (type === 'trit') {
      if (rawVal.includes('truth()') || rawVal.trim()==='1') defaultVal=1;
      else if (rawVal.includes('conflict()') || rawVal.trim()==='-1') defaultVal=-1;
      else defaultVal=0;
    } else if (type === 'int') {
      defaultVal = parseInt(rawVal) || 0;
    } else {
      defaultVal = parseFloat(rawVal) || 0.0;
    }
    params.push({name, type, defaultVal});
  }
  return params;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 5: UI — FILE BROWSER
// ═══════════════════════════════════════════════════════════════════════════

let allFiles = {}; // path → content
let activeFile = null;
const interp = new TernInterpreter();

function openFolder() {
  document.getElementById('folder-input').click();
}

function handleFolderSelect(input) {
  const files = Array.from(input.files).filter(f => f.name.endsWith('.tern'));
  if (!files.length) { statusMsg('No .tern files found in selected folder.'); return; }
  allFiles = {};
  const readers = files.map(f => new Promise((res) => {
    const r = new FileReader();
    r.onload = e => {
      // Use the relative path, stripping any leading path before stdlib/
      let path = f.webkitRelativePath || f.name;
      // Normalize: keep only from the last top-level dir
      const parts = path.split('/');
      path = parts.slice(1).join('/'); // remove root folder name
      allFiles[path] = e.target.result;
      res();
    };
    r.readAsText(f);
  }));
  Promise.all(readers).then(() => {
    buildFileTree(allFiles);
    statusMsg(`Loaded ${files.length} .tern files`, 'ready');
    document.getElementById('btn-run').disabled = false;
  });
}

function buildFileTree(files) {
  const tree = document.getElementById('file-tree');
  tree.innerHTML = '';
  // Group by directory
  const dirs = {};
  for (const path of Object.keys(files).sort()) {
    const parts = path.split('/');
    const dir = parts.length > 1 ? parts.slice(0,-1).join('/') : '(root)';
    const name = parts[parts.length-1];
    if (!dirs[dir]) dirs[dir] = [];
    dirs[dir].push({path, name});
  }
  for (const [dir, items] of Object.entries(dirs)) {
    const header = document.createElement('div');
    header.className = 'dir-header';
    header.innerHTML = `<span class="arrow">▾</span> ${dir}`;
    header.onclick = () => {
      header.classList.toggle('collapsed');
      fileList.classList.toggle('hidden');
    };
    tree.appendChild(header);
    const fileList = document.createElement('div');
    fileList.className = 'dir-files';
    for (const {path, name} of items) {
      const item = document.createElement('div');
      item.className = 'file-item';
      item.dataset.path = path;
      item.innerHTML = `<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="opacity:0.5;flex-shrink:0"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>${name}`;
      item.onclick = () => openFile(path, item);
      fileList.appendChild(item);
    }
    tree.appendChild(fileList);
  }
}

function filterTree(query) {
  query = query.toLowerCase();
  const items = document.querySelectorAll('.file-item');
  const headers = document.querySelectorAll('.dir-header');
  items.forEach(item => {
    const match = item.dataset.path.toLowerCase().includes(query);
    item.style.display = match ? 'flex' : 'none';
  });
  // Show/hide directory headers based on whether they have visible children
  headers.forEach(h => {
    const files = h.nextElementSibling;
    if (!files) return;
    const anyVisible = Array.from(files.querySelectorAll('.file-item'))
      .some(i => i.style.display !== 'none');
    h.style.display = anyVisible ? 'flex' : 'none';
    files.classList.toggle('hidden', !anyVisible && query.length > 0);
  });
}

function openFile(path, el) {
  document.querySelectorAll('.file-item.active').forEach(i => i.classList.remove('active'));
  el.classList.add('active');
  activeFile = path;
  const content = allFiles[path] || '';
  document.getElementById('editor').value = content;
  document.getElementById('tab-name').textContent = path.split('/').pop();
  document.getElementById('tb-filename').textContent = path;
  onEditorChange();
  addLog('sys', `Opened: ${path}`);
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 6: PARAMETER UI
// ═══════════════════════════════════════════════════════════════════════════

let currentParams = []; // {name, type, defaultVal, currentVal}

function onEditorChange() {
  const src = document.getElementById('editor').value;
  const detected = detectParams(src);
  // Merge with existing (keep user's current selection)
  const existing = {};
  currentParams.forEach(p => { existing[p.name] = p.currentVal; });
  currentParams = detected.map(p => ({
    ...p,
    currentVal: existing.hasOwnProperty(p.name) ? existing[p.name] : p.defaultVal
  }));
  renderParams();
}

function renderParams() {
  const box = document.getElementById('params-content');
  if (!currentParams.length) {
    box.innerHTML = '<div class="no-params">No top-level variables detected.</div>';
    return;
  }
  box.innerHTML = '';
  for (const p of currentParams) {
    const row = document.createElement('div');
    row.className = 'param-row';
    if (p.type === 'trit') {
      row.innerHTML = `
        <div class="param-label">
          <span>${p.name}</span><span class="param-type">: trit</span>
        </div>
        <div class="trit-btns">
          <button class="trit-btn ${p.currentVal===-1?'sel-neg':''}" data-name="${p.name}" data-val="-1" onclick="setTrit(this,-1)">−1</button>
          <button class="trit-btn ${p.currentVal===0?'sel-zer':''}"  data-name="${p.name}" data-val="0"  onclick="setTrit(this,0)">0</button>
          <button class="trit-btn ${p.currentVal===1?'sel-pos':''}"  data-name="${p.name}" data-val="1"  onclick="setTrit(this,1)">+1</button>
        </div>`;
    } else {
      const step = p.type === 'float' ? '0.01' : '1';
      row.innerHTML = `
        <div class="param-label">
          <span>${p.name}</span><span class="param-type">: ${p.type}</span>
        </div>
        <input class="num-input" type="number" step="${step}" value="${p.currentVal}"
          onchange="setNum('${p.name}', this.value, '${p.type}')">`;
    }
    box.appendChild(row);
  }
}

function setTrit(btn, val) {
  const name = btn.dataset.name;
  const p = currentParams.find(x => x.name === name);
  if (!p) return;
  p.currentVal = val;
  // Update button styles
  const parent = btn.parentElement;
  parent.querySelectorAll('.trit-btn').forEach(b => {
    b.classList.remove('sel-neg','sel-zer','sel-pos');
  });
  btn.classList.add(val===-1?'sel-neg':val===0?'sel-zer':'sel-pos');
}

function setNum(name, val, type) {
  const p = currentParams.find(x => x.name === name);
  if (!p) return;
  p.currentVal = type === 'float' ? parseFloat(val) : parseInt(val);
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 7: EXECUTION
// ═══════════════════════════════════════════════════════════════════════════

function runProgram() {
  const src = document.getElementById('editor').value.trim();
  if (!src) return;

  setStatus('running');
  document.getElementById('btn-run').disabled = true;
  setResult('running', '...', 'compiling');

  // Build overrides from params panel
  const overrides = {};
  for (const p of currentParams) {
    if (p.type === 'trit') {
      overrides[p.name] = {k:'trit', v:p.currentVal};
    } else if (p.type === 'int') {
      overrides[p.name] = {k:'int', v:p.currentVal};
    } else {
      overrides[p.name] = {k:'float', v:p.currentVal};
    }
  }

  // Slight async to let the UI update
  setTimeout(() => {
    const result = interp.run(src, overrides);

    // Push interpreter logs to output
    for (const l of interp.logs) addLog(l.kind==='sys'?'sys':l.kind==='err'?'err':l.kind, l.msg, l.time);

    if (result.state === 'error') {
      setResult('error', 'ERROR', result.code || 'ERR');
      addLog('err', `→ details: stdlib/errors/${result.code}.tern`);
      setStatus('error');
    } else {
      const v = result.value;
      const n = interp._tri(v);
      if (n === 1) setResult('affirm', 'AFFIRM  +1', '');
      else if (n === -1) setResult('conflict', 'CONFLICT  −1', '');
      else setResult('hold', 'HOLD  0', '');
      setStatus('ready');
    }

    document.getElementById('btn-run').disabled = false;
  }, 30);
}

function setResult(state, label, code) {
  const box = document.getElementById('result-box');
  box.className = '';
  if (state !== 'running') box.classList.add('state-' + state);
  document.getElementById('result-state').textContent = label;
  document.getElementById('result-code').textContent = code;
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 8: OUTPUT LOG
// ═══════════════════════════════════════════════════════════════════════════

function addLog(kind, msg, date) {
  const log = document.getElementById('log-output');
  const d = date || new Date();
  const time = d.toTimeString().slice(0,8);
  const div = document.createElement('div');
  div.className = 'log-line';
  const cls = kind==='err'?'log-err':kind==='out'?'log-out':kind==='affirm'?'log-affirm':kind==='reject'?'log-reject':kind==='hold'?'log-hold':'log-sys';
  div.innerHTML = `<span class="log-time">${time}</span><span class="${cls}">${escHtml(msg)}</span>`;
  log.appendChild(div);
  log.scrollTop = log.scrollHeight;
}

function clearOutput() {
  document.getElementById('log-output').innerHTML = '';
  setResult('', 'AWAITING', '');
  document.getElementById('result-box').className = '';
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ═══════════════════════════════════════════════════════════════════════════
// SECTION 9: STATUS + CURSOR
// ═══════════════════════════════════════════════════════════════════════════

function setStatus(state) {
  const dot = document.getElementById('status-dot');
  const msg = document.getElementById('status-msg');
  dot.className = state;
  msg.textContent = state;
}

function statusMsg(text, state='') {
  document.getElementById('status-msg').textContent = text;
  if (state) setStatus(state);
}

function updateCursor() {
  const ed = document.getElementById('editor');
  const text = ed.value.slice(0, ed.selectionStart);
  const lines = text.split('\n');
  document.getElementById('cursor-ln').textContent = lines.length;
  document.getElementById('cursor-col').textContent = lines[lines.length-1].length + 1;
}

// Tab key support in editor
document.getElementById('editor').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault();
    const start = e.target.selectionStart, end = e.target.selectionEnd;
    e.target.value = e.target.value.slice(0,start) + '    ' + e.target.value.slice(end);
    e.target.selectionStart = e.target.selectionEnd = start + 4;
  }
  // Ctrl+Enter → run
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    e.preventDefault(); runProgram();
  }
});

// Ctrl+Enter from anywhere
document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
    if (document.activeElement !== document.getElementById('editor')) runProgram();
  }
});

// Init
document.getElementById('init-time').textContent = new Date().toTimeString().slice(0,8);
document.getElementById('btn-run').disabled = false;

// Auto-load embedded stdlib into the file tree
(function loadStdlib() {
  allFiles = {...STDLIB_EMBED};
  buildFileTree(allFiles);
  statusMsg(`stdlib ready — ${Object.keys(allFiles).length} files`, 'ready');
  addLog('sys', `Embedded stdlib loaded: errors/ + core/ (${Object.keys(allFiles).length} files)`);
  addLog('sys', 'Click a file in the explorer, or type directly in the editor → RUN');
})();

onEditorChange(); // detect params in placeholder
</script>
