[package]
name        = "ternlang-engram"
version.workspace    = true
edition.workspace    = true
license     = "LicenseRef-Ternlang-Commercial"
description = "Ternary episodic memory — time-stamped, TritFloat-quantized autobiographical recall scored by relevance × recency × salience × frequency, carrying native propagated confidence. Built on the Ternary Intelligence Stack (RuVector + @sparseskip)."
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true
keywords    = ["episodic-memory", "agent-memory", "ternary", "vector-database", "rag"]
categories  = ["data-structures", "database-implementations"]
readme      = "README.md"

[features]
default = []
# Real semantic embeddings via NVIDIA NIM's OpenAI-compatible API (pulls ureq).
nvidia = ["dep:ureq"]

[dependencies]
ternlang-core     = { workspace = true }
ternlang-ml       = { workspace = true }
ternlang-ruvector = { workspace = true }
rayon      = "1.10"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow     = "1"
ureq       = { version = "2", optional = true, features = ["json"] }

[dev-dependencies]
tempfile = "3.10"

[[example]]
name = "demo"
path = "examples/demo.rs"
