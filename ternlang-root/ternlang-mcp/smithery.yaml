# ─── System Prompt ───────────────────────────────────────────────────────────
systemPrompt: |
  You have access to the Ternary Intelligence Stack (TIS) — a set of tools that
  add a **third decision state** to your reasoning. Instead of forcing every
  question into YES or NO, you can now hold (trit = 0) when evidence is
  genuinely insufficient.

  ## When to use these tools

  Use **trit_decide** or **trit_vector** whenever you face a decision where:
  - Evidence is contradictory or incomplete
  - Confidence matters (medical, legal, financial, safety-critical contexts)
  - You would otherwise be tempted to guess between two options

  Use **moe_orchestrate** for complex, multi-faceted queries that benefit from
  routing through 13 domain experts (reasoning, safety, world-knowledge, etc).

  Use **trit_action_gate** before executing any irreversible action — it lets
  you define hard-block safety dimensions that veto unconditionally.

  Use **trit_debate** when a user presents two competing claims and wants a
  balanced verdict rather than you picking a side.

  Use **trit_audit** or **trit_calibrate** when asked to evaluate an AI
  system's decision history for binary habituation or EU AI Act compliance.

  Use **trit_uncertainty_map** to annotate documents, reports, or research
  papers with per-sentence confidence signals before summarizing or acting.

  ## The hold state is not weakness

  A trit = 0 (hold/tend) result means: **gather more evidence before
  committing**. It is an active routing instruction, not an error. When a tool
  returns hold, surface the uncertainty to the user and ask for the missing
  evidence rather than collapsing it to a binary guess.

  ## No API key required for community tools

  All 19 tools are available without an API key. Pro/Industrial/Enterprise
  tiers unlock premium memory and analytics tools — obtain a key at
  https://ternlang.com/activate.

# ─── Protocol ────────────────────────────────────────────────────────────────
protocol: "2024-11-05"

# ─── Tool manifest ───────────────────────────────────────────────────────────

tools:
  - name: trit_decide
    title: "Trit Decide — Scalar Evidence → Ternary Decision"
    description: >
      Convert float evidence signals into a ternary decision (reject/hold/affirm)
      with confidence score. The core primitive. Maps uncertain scalars to one of
      three states: -1=reject, 0=hold (deliberate), +1=affirm. The hold zone is
      not null — it is an active routing instruction to gather more evidence.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [evidence]
      properties:
        evidence:
          type: array
          items: { type: number }
          description: "Numeric evidence signals ∈ [-1.0, +1.0]. Positive = affirm signal, negative = reject signal, near-zero = uncertain. Mean is computed as the aggregate scalar."
        min_confidence:
          type: number
          description: "Minimum confidence threshold for is_actionable (0.0–1.0, default 0.0). Raise to require stronger signal before acting."

  - name: trit_vector
    title: "Trit Vector — Multi-Dimensional Evidence Aggregation"
    description: >
      Multi-dimensional ternary evidence aggregation. Provide named evidence
      dimensions each with a scalar value and importance weight. Returns aggregate
      trit, per-dimension breakdown, dominant dimension, and a plain-language
      recommendation. The full agent reasoning tool.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          description: "Named evidence dimensions. Each has a label, value ∈ [-1,1], and optional weight."
          items:
            type: object
            required: [label, value]
            properties:
              label:  { type: string,  description: "Name of this evidence source (e.g. 'safety_check', 'user_consent')." }
              value:  { type: number,  description: "Evidence scalar ∈ [-1.0, +1.0]. Negative = opposing, positive = supporting." }
              weight: { type: number,  description: "Importance weight ≥ 0 (default 1.0). Higher = more influence on aggregate." }
        min_confidence:
          type: number
          description: "Minimum confidence for is_actionable (0.0–1.0, default 0.5)."

  - name: trit_consensus
    title: "Trit Consensus — Balanced Ternary Addition"
    description: >
      Compute balanced ternary consensus between two trit signals.
      Consensus is the core ternary addition operator: truth+conflict=hold,
      truth+truth=truth, conflict+conflict=conflict. Use this to merge two
      independent ternary judgements into a single signal.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [a, b]
      properties:
        a: { type: integer, enum: [-1, 0, 1], description: "First trit: -1=conflict/reject, 0=hold/uncertain, 1=truth/affirm." }
        b: { type: integer, enum: [-1, 0, 1], description: "Second trit: -1=conflict/reject, 0=hold/uncertain, 1=truth/affirm." }

  - name: trit_eval
    title: "Trit Eval — BET VM Expression Evaluator"
    description: >
      Evaluate a ternary expression on the live BET (Balanced Ternary Execution)
      VM. Supports: consensus(a,b), invert(x), truth(), hold(), conflict(),
      arithmetic (+, -, *), and let bindings.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [expression]
      properties:
        expression:
          type: string
          description: "A ternlang expression or statement. E.g. 'consensus(1, -1)' or 'let x: trit = 1; return -x;'"

  - name: ternlang_run
    title: "Ternlang Run — Execute .tern Programs"
    description: >
      Compile and execute a full ternlang (.tern) program on the BET VM.
      Returns register state after execution. Use this to run complete ternary
      programs with control flow, trit variables, and match expressions.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [code]
      properties:
        code:
          type: string
          description: "Full ternlang source code to compile and run. Programs use trit types, match expressions, and BET opcodes."

  - name: quantize_weights
    title: "Quantize Weights — Float → Ternary (BitNet)"
    description: >
      Quantize an array of float weights to balanced ternary (-1, 0, +1) using
      BitNet-style thresholding (τ = 0.5 × mean(|w|)). Returns the trit vector,
      sparsity ratio, and zero-state count. Core primitive for ternary neural nets.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [weights]
      properties:
        weights:
          type: array
          items: { type: number }
          description: "Float weight values to quantize (e.g. from a neural network layer)."
        threshold:
          type: number
          description: "Manual quantization threshold. Omit to auto-compute via BitNet formula (τ = 0.5 × mean(|w|))."

  - name: sparse_benchmark
    title: "Sparse Benchmark — Ternary Matmul Efficiency"
    description: >
      Run sparse vs dense ternary matrix multiply benchmark. Shows how many
      multiply-accumulate operations are skipped due to zero-state (hold) weights.
      Demonstrates the computational efficiency of ternary AI inference — up to
      122x throughput at 99%+ sparsity.
    annotations:
      readOnlyHint: true
      idempotentHint: false
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties:
        rows:      { type: integer, description: "Matrix rows (default 4)." }
        cols:      { type: integer, description: "Matrix columns (default 4)." }
        weights:   { type: array, items: { type: number }, description: "Flat row-major float weights. Length must equal rows×cols. Omit for auto demo distribution." }
        threshold: { type: number, description: "Quantization threshold. Omit to auto-compute." }

  - name: moe_orchestrate
    title: "MoE Orchestrate — Full 13-Expert Ternary Reasoning"
    description: >
      Full MoE-13 ternary orchestration pass. Routes your query through 13 domain
      experts (Syntax, WorldKnowledge, DeductiveReason, InductiveReason, ToolUse,
      Persona, Safety, FactCheck, CausalReason, AmbiguityRes, MathReason,
      ContextMem, MetaSafety) using dual-key synergistic routing.

      Safety hard gate fires first — negative safety field = immediate reject.
      Returns: trit decision, confidence, held flag, safety_vetoed flag,
      temperature hint, triad field details, and per-expert verdicts.
    annotations:
      readOnlyHint: true
      idempotentHint: false
      destructiveHint: false
      openWorldHint: true
    inputSchema:
      type: object
      required: [query]
      properties:
        query:
          type: string
          description: "The question or decision to orchestrate through MoE-13."
        evidence:
          type: array
          items: { type: number }
          description: "Optional 6-element evidence vector: [syntax, world_knowledge, reasoning, tool_use, persona, safety] ∈ [-1.0, +1.0]. Omit for neutral (all zeros)."

  - name: moe_deliberate
    title: "MoE Deliberate — EMA Iterative Convergence"
    description: >
      EMA-based ternary deliberation engine. Models iterative reasoning: given
      an initial scalar and a series of evidence updates, converges toward a
      stable ternary decision using exponential moving average. The agent
      accumulates evidence across rounds and commits only when confidence
      crosses the target threshold.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [initial_scalar]
      properties:
        initial_scalar:
          type: number
          description: "Starting evidence scalar ∈ [-1.0, +1.0]. Near-zero = maximum uncertainty."
        target_confidence:
          type: number
          description: "Confidence threshold to stop deliberating (0.0–1.0, default 0.8). Agent holds until this is met."
        alpha:
          type: number
          description: "EMA smoothing factor (0.0–1.0, default 0.4). High = fast adaptation. Low = strong prior."
        max_rounds:
          type: integer
          description: "Maximum deliberation rounds before returning tend (default 10)."
        evidence_updates:
          type: array
          items: { type: number }
          description: "Sequence of incoming evidence scalars, one per round. Omit to replay initial_scalar each round."

  - name: trit_action_gate
    title: "Trit Action Gate — Safety Veto + Weighted Vote"
    description: >
      Multi-dimensional ternary action gate with hard-block safety veto. Any
      dimension marked hard_block:true with a negative trit VETOES the action
      unconditionally, regardless of other dimensions. Non-veto dimensions
      contribute to a weighted vote. Returns Pass, Blocked, or Hold.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [dimensions]
      properties:
        dimensions:
          type: array
          description: "Gate dimensions. Each has a label, trit signal, weight, and optional hard_block flag."
          items:
            type: object
            required: [label, trit]
            properties:
              label:      { type: string,  description: "Name of this decision dimension (e.g. 'safety', 'user_consent')." }
              trit:       { type: integer, enum: [-1, 0, 1], description: "-1=block, 0=hold, 1=pass." }
              weight:     { type: number,  description: "Importance weight ≥ 0 (default 1.0). Ignored for hard_block dims." }
              hard_block: { type: boolean, description: "If true, a trit of -1 on this dimension vetoes the action regardless of all other dimensions." }

  - name: trit_debate
    title: "Trit Debate — Structured 3-Way Verdict on Competing Claims"
    description: >
      Give two competing claims — get a structured 3-way verdict. Routes each
      claim through MoE-13 independently, compares verdicts, and surfaces the
      tension between them. Output: for_a (trit+confidence), for_b
      (trit+confidence), tension (0–1), synthesis, verdict
      (AGREEMENT / CONFLICT / HOLD).
    annotations:
      readOnlyHint: true
      idempotentHint: false
      destructiveHint: false
      openWorldHint: true
    inputSchema:
      type: object
      required: [claim_a, claim_b]
      properties:
        claim_a:  { type: string, description: "First claim or position to evaluate." }
        claim_b:  { type: string, description: "Second claim or position to evaluate against claim_a." }
        context:  { type: string, description: "Optional background context shared by both claims." }

  - name: trit_uncertainty_map
    title: "Trit Uncertainty Map — Text Annotation by Confidence"
    description: >
      Annotate any text at sentence or paragraph level with ternary signals and
      confidence scores. Tend annotations mark genuinely hedged or uncertain
      claims — the areas that need verification before acting. Useful for medical
      reports, legal clauses, meeting notes, and research papers.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [text]
      properties:
        text:        { type: string, description: "The text to annotate with ternary uncertainty signals." }
        granularity: { type: string, enum: ["sentence", "paragraph"], description: "Annotation granularity: sentence (default) or paragraph." }

  - name: trit_calibrate
    title: "Trit Calibrate — Binary Habituation Detector"
    description: >
      Feed an AI agent's recent decision log and get a calibration report.
      Detects binary habituation: how often did the agent force YES/NO when it
      should have held? Returns binary_ratio, hold_opportunities,
      calibration_score (trit), and flagged decisions with explanations.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          description: "Array of recent agent decisions to calibrate."
          items:
            type: object
            required: [input, output]
            properties:
              input:      { type: string, description: "The prompt or question the agent received." }
              output:     { type: string, description: "The agent's decision or response (yes/no/affirm/reject etc)." }
              confidence: { type: number, description: "Reported confidence 0–1 (optional). Used to detect over-confidence." }

  - name: trit_translate
    title: "Trit Translate — Binary Code → Ternary .tern Programs"
    description: >
      Translate Python if/elif/else, SQL CASE WHEN, or JSON rule arrays into
      equivalent .tern programs with the ternary hold zone inserted where the
      original code had no coverage. Makes binary gaps explicit as Tend arms.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [code]
      properties:
        code:     { type: string, description: "The source code to translate into ternlang." }
        language: { type: string, enum: ["python", "sql", "json_rules"], description: "Source language (default: python)." }

  - name: trit_eco_check
    title: "Trit Eco Check — Human + Ecocentric Dual Perspective"
    description: >
      Given a proposed action, returns two trit scores: one from a human-centric
      perspective (MoE-13) and one from an ecocentric perspective (EcoCore
      heuristic). When they diverge, synthesis is Tend — this needs more
      consideration. The first MCP tool that asks: is this good for everything,
      not just us?
    annotations:
      readOnlyHint: true
      idempotentHint: false
      destructiveHint: false
      openWorldHint: true
    inputSchema:
      type: object
      required: [action]
      properties:
        action:  { type: string, description: "The proposed action or decision to evaluate from human and ecocentric perspectives." }
        context: { type: string, description: "Optional additional context about the action." }
        scope:   { type: string, enum: ["local", "regional", "global"], description: "Impact scope (default: local). Broader scope amplifies ecological weight." }

  - name: trit_audit
    title: "Trit Audit — EU AI Act Compliance Report"
    description: >
      Full ternary audit of an AI system's decision log. Answers: 'how binary is
      this AI's decision-making, and would a regulator flag it?' Returns:
      decision counts, forced_binary_ratio, EU AI Act heuristic (Articles 13/14),
      calibration score, and a list of decisions that should have held.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [decisions]
      properties:
        decisions:
          type: array
          description: "Array of AI decisions to audit for ternary compliance."
          items:
            type: object
            required: [input, output]
            properties:
              input:      { type: string, description: "The input prompt or question." }
              output:     { type: string, description: "The AI's response or decision." }
              confidence: { type: number, description: "Reported confidence 0–1 (optional)." }

  - name: audit_ternary_logic
    title: "Audit Ternary Logic — Triadic Code Compliance Check"
    description: >
      Performs a compliance audit on a snippet of Ternlang or triadic-inspired
      code. Detects Binary Habituation (over-reliance on true/false) and suggests
      Deliberation Injection to break binary logic drifts. Reports sparsity
      potential and MoE-13 safety gate alignment.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [code]
      properties:
        code: { type: string, description: "The code snippet to audit for triadic compliance and binary habituation." }

  - name: tsql_join
    title: "T-SQL Join — Ternary Triadic Database Join"
    description: >
      Enterprise T-SQL Triadic Join. Unlike binary SQL (Match/No-Match), a
      T-Join routes partial matches into a Deliberative Hold (State 0) for
      escrow audit. Guarantees 100% data retention and eliminates binary
      error-handling overhead for high-frequency trading and defense datasets.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      required: [record_a, record_b]
      properties:
        record_a: { type: array, items: { type: number }, description: "Vector representation of record A (numeric feature columns)." }
        record_b: { type: array, items: { type: number }, description: "Vector representation of record B to join against record A." }

  - name: get_industrial_standards
    title: "Get Industrial Standards — RFI-IRFOS Triadic Standards"
    description: >
      Returns the list of current triadic industrial standards published by
      RFI-IRFOS. Use this to determine compliance requirements for tokenization,
      memory, compute currency, hardware access, and neural encoding.
    annotations:
      readOnlyHint: true
      idempotentHint: true
      destructiveHint: false
      openWorldHint: false
    inputSchema:
      type: object
      properties: {}
