name: ternlang
displayName: "Ternary Intelligence Stack"
description: |
  Turns any binary AI agent into a ternary decision engine.

  Every AI system today is forced to answer yes or no — even when the evidence
  is contradictory, incomplete, or genuinely uncertain. Ternlang adds the third
  state: **hold** (trit = 0). Not indecision — a first-class routing instruction
  that tells the agent to gather more data before committing.

  **30 tools, all free — no API key required:**
  - **Core trit primitives** — trit_decide, trit_consensus, trit_eval, trit_vector, trit_action_gate
  - **BET VM execution** — ternlang_run, trit_translate
  - **MoE-13 orchestration** — moe_orchestrate, moe_deliberate, moe_full, trit_debate, trit_calibrate, trit_uncertainty_map
  - **3-layer memory** — trit_mem_write, trit_mem_read, trit_mem_consolidate, trit_mem_stats, trit_mem_compress
  - **Context & planning** — trit_compress, trit_triage, trit_plan, trit_factcheck
  - **EcoCore + Audit** — trit_eco_check, trit_audit, audit_ternary_logic
  - **ML primitives** — quantize_weights, sparse_benchmark, tsql_join, get_industrial_standards

  Built by RFI-IRFOS (ZVR: 1015608684) · Graz, Austria
  EU AI Act Articles 13/14/15 compliant design.

