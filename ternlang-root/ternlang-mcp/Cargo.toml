[package]
name        = "ternlang-mcp"
description = "MCP server for ternlang — connects any AI agent to balanced ternary decision logic via trit_decide and friends."
readme = "README.md"
version.workspace   = true
edition.workspace   = true
license          = "LicenseRef-BSL-1.1"
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true
keywords.workspace   = true
categories.workspace = true

[lib]
name = "ternlang_mcp"
path = "src/lib.rs"

[[bin]]
name = "ternlang-mcp"
path = "src/main.rs"
required-features = ["server"]

[features]
default = []
nvidia = ["ternlang-engram/nvidia"]
server = []  # enables the full MCP server binary

[dependencies]
ternlang-core   = { workspace = true }
ternlang-ml     = { workspace = true }
ternlang-moe    = { workspace = true }
ternlang-engram = { workspace = true, features = ["nvidia"] }
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"
