[package]
name = "ternlang-ruvector"
version = "1.2.4"
edition = "2024"
license = "LicenseRef-Ternlang-Commercial"
description = "Ternary-optimized Sparse GEMV acceleration for Vector Databases (RuVector Bridge)"

[dependencies]
ternlang-core = { path = "../compiler/legacy_shim/ternlang-core", version = "1.2.4" }
ternlang-ml   = { path = "../ternlang-ml", version = "1.2.4" }
rayon         = "1.10"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
anyhow        = "1.0"

[dev-dependencies]
tempfile = "3.10"
