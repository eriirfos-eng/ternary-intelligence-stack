[package]
name = "ternlang-ruvector"
version.workspace = true
edition.workspace = true
license = "LicenseRef-Ternlang-Commercial"
description = "Ternary-optimized Sparse GEMV acceleration for Vector Databases (RuVector Bridge)"

[dependencies]
ternlang-core = { workspace = true }
ternlang-ml   = { workspace = true }
rayon         = "1.10"
serde         = { version = "1.0", features = ["derive"] }
serde_json    = "1.0"
anyhow        = "1.0"

[dev-dependencies]
tempfile = "3.10"
