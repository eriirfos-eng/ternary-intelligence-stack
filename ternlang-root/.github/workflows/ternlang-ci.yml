name: Ternlang CI

on:
  push:
    branches: [ main, staging ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build BET VM & compiler
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            compiler/legacy_shim/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('compiler/legacy_shim/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build ternlang-cli
        working-directory: compiler/legacy_shim
        run: cargo build --bin ternlang-cli --release

      - name: Smoke test — version
        working-directory: compiler/legacy_shim
        run: ./target/release/ternlang-cli --version

      - name: Smoke test — stdlib error examples
        working-directory: compiler/legacy_shim
        run: |
          CLI=./target/release/ternlang-cli
          PASS=0; FAIL=0
          for f in ../../stdlib/errors/BET-00{1,2,3,4,5,6,7}.tern \
                   ../../stdlib/errors/FN-00{1,2,3,4}.tern \
                   ../../stdlib/errors/PARSE-00{1,2,3,4}.tern; do
            if [ -f "$f" ]; then
              if $CLI run "$f" > /dev/null 2>&1; then
                echo "PASS: $f"; PASS=$((PASS+1))
              else
                echo "FAIL: $f"; FAIL=$((FAIL+1))
              fi
            fi
          done
          echo "Results: $PASS passed, $FAIL failed"
          [ $PASS -gt 0 ]
