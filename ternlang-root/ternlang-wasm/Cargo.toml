[package]
name        = "ternlang-wasm"
description = "WebAssembly bindings for the Ternlang BET VM — runs real .tern programs in the browser."
publish           = false
version.workspace   = true
edition.workspace   = true
license.workspace   = true
repository.workspace = true
homepage.workspace  = true
authors.workspace   = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ternlang-core = { path = "../compiler/legacy_shim/ternlang-core", version = "1.0.0" }
wasm-bindgen  = "0.2"
serde         = { version = "1", features = ["derive"] }
serde_json    = "1"

[profile.release]
opt-level     = "z"
lto           = true
panic         = "abort"
