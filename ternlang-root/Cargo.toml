[workspace]
members = [
    "compiler/legacy_shim/ternlang-core",
    "ternlang-wasm",
    "compiler/legacy_shim/ternlang-codegen",
    "compiler/legacy_shim/ternlang-runtime",
    "compiler/legacy_shim/ternlang-cli",
    "ternlang-ml",
    "ternlang-compress",
    "ternlang-api",
    "ternlang-test",
    "ternlang-mcp",
    "ternlang-hdl",
    "ternlang-lsp",
    "ternpkg",
    "ternlang-compat",
    "ternlang-moe",
    "ternlang-ruvector",
]
resolver = "2"

[workspace.package]
version     = "1.3.6"
edition     = "2024"
license     = "LGPL-3.0-or-later"
repository  = "https://github.com/eriirfos-eng/ternary-intelligence-stack"
homepage    = "https://ternlang.com"
authors     = [
    "Simeon Kepp <s.kepp@ternlang.com> (https://www.linkedin.com/in/simeon-kepp/)",
    "Nikoletta Csonka <csonikoletta@ternlang.com> (https://www.linkedin.com/in/csonikoletta/)",
    "Zabih Karimi <z.karimi@ternlang.com> (https://www.linkedin.com/in/zabih-karimi-3292ab349/)",
    "Lisa Scharler <l.scharler@ternlang.com> (https://www.linkedin.com/in/lisa-scharler-innovation-management-technology-entrepreneurship-future-education/)",
    "Louis Paul Ehrig <l.ehrig@ternlang.com> (https://www.linkedin.com/in/louis-ehrig-317941335/)",
    "RFI-IRFOS <licensing@ternlang.com>"
]
keywords    = ["ternary", "trit", "balanced-ternary", "vm", "compiler"]
categories  = ["compilers", "science"]

[workspace.dependencies]
ternlang-core    = { path = "compiler/legacy_shim/ternlang-core",    version = "1.3.6" }
ternlang-codegen = { path = "compiler/legacy_shim/ternlang-codegen", version = "1.3.6" }
ternlang-runtime = { path = "compiler/legacy_shim/ternlang-runtime", version = "1.3.6" }
ternlang-cli     = { path = "compiler/legacy_shim/ternlang-cli",     version = "1.3.6" }
ternlang-ml      = { path = "ternlang-ml",      version = "1.3.6" }
ternlang-compress = { path = "ternlang-compress", version = "1.3.6" }
ternlang-api     = { path = "ternlang-api",     version = "1.3.6" }
ternlang-test    = { path = "ternlang-test",    version = "1.3.6" }
ternlang-mcp     = { path = "ternlang-mcp",     version = "1.3.6" }
ternlang-hdl     = { path = "ternlang-hdl",     version = "1.3.6" }
ternlang-lsp     = { path = "ternlang-lsp",     version = "1.3.6" }
ternpkg          = { path = "ternpkg",          version = "1.3.6" }
ternlang-compat  = { path = "ternlang-compat",  version = "1.3.6" }
ternlang-moe     = { path = "ternlang-moe",     version = "1.3.6" }
