[workspace]
members = [
    "compiler/legacy_shim/ternlang-core",
    "compiler/legacy_shim/ternlang-codegen",
    "compiler/legacy_shim/ternlang-runtime",
    "compiler/legacy_shim/ternlang-cli",
    "ternlang-ml",
    "ternlang-compress",
    "ternlang-api",
    "ternlang-test",
    "ternlang-mcp",
    "ternlang-hdl",
    "ternlang-lsp",
    "ternpkg",
    "ternlang-compat",
    "ternlang-moe",
]
resolver = "2"

[workspace.package]
version     = "0.3.2"
edition     = "2024"
license     = "LGPL-3.0-or-later"
repository  = "https://github.com/eriirfos-eng/ternary-intelligence-stack"
homepage    = "https://ternlang.com"
authors     = [
    "Simeon Kepp <rfi.irfos@gmail.com>",
    "Nikoletta Csonka <csonikoletta@ternlang.com>",
    "Zabih Karimi <z.karimi@ternlang.com>",
    "RFI-IRFOS <licensing@ternlang.com>"
]
keywords    = ["ternary", "trit", "balanced-ternary", "vm", "compiler"]
categories  = ["compilers", "science"]

[workspace.dependencies]
ternlang-core    = { path = "compiler/legacy_shim/ternlang-core",    version = "0.3.2" }
ternlang-codegen = { path = "compiler/legacy_shim/ternlang-codegen", version = "0.3.2" }
ternlang-runtime = { path = "compiler/legacy_shim/ternlang-runtime", version = "0.3.2" }
ternlang-cli     = { path = "compiler/legacy_shim/ternlang-cli",     version = "0.3.2" }
ternlang-ml      = { path = "ternlang-ml",      version = "0.3.2" }
ternlang-compress = { path = "ternlang-compress", version = "0.3.2" }
ternlang-api     = { path = "ternlang-api",     version = "0.3.2" }
ternlang-test    = { path = "ternlang-test",    version = "0.3.2" }
ternlang-mcp     = { path = "ternlang-mcp",     version = "0.3.2" }
ternlang-hdl     = { path = "ternlang-hdl",     version = "0.3.2" }
ternlang-lsp     = { path = "ternlang-lsp",     version = "0.3.2" }
ternpkg          = { path = "ternpkg",          version = "0.3.2" }
ternlang-compat  = { path = "ternlang-compat",  version = "0.3.2" }
ternlang-moe     = { path = "ternlang-moe",     version = "0.3.2" }
