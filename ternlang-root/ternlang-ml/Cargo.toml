[package]
name        = "ternlang-ml"
description = "Ternary ML inference kernels — quantize, sparse_matmul (@sparseskip), TritMatrix, deliberation engine, action gate, and MLP for the Ternlang ecosystem."
readme = "README.md"
version.workspace   = true
edition.workspace   = true
license          = "LicenseRef-BSL-1.1"
repository.workspace = true
homepage.workspace  = true
authors.workspace   = true
keywords.workspace  = true
categories.workspace = true

[dependencies]
ternlang-core = { workspace = true }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
bincode = "1.3"
