<title>melting chocolate · ternlang</title>
<style>
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color:#fff3e2; min-height:100%; overflow:hidden; position:relative; background:#160e07;
    -webkit-font-smoothing:antialiased;
  }
  /* Ana's window — the real view from Mendoza, turned into a soft pixel graphic */
  img.bg{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:0;
    image-rendering:pixelated; }
  .vign{ position:fixed; inset:0; z-index:1; pointer-events:none;
    background:
      radial-gradient(120% 100% at 50% 36%, transparent 42%, rgba(18,9,4,.34) 100%),
      linear-gradient(180deg, rgba(18,9,4,.12) 0%, transparent 30%, transparent 52%, rgba(18,9,4,.58) 100%); }
  .heat{ position:fixed; left:0; right:0; bottom:0; height:42%; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(255,220,150,.04), rgba(255,200,120,.10));
    mix-blend-mode:screen; animation:shimmer 4s ease-in-out infinite; }
  @keyframes shimmer{ 0%,100%{ opacity:.5; transform:translateY(0) } 50%{ opacity:.85; transform:translateY(-3px) } }
  canvas#drips{ position:fixed; inset:0; z-index:2; pointer-events:none; }

  /* ── the bar: a molded dark-chocolate slab. JS shrinks it as it melts. ───────── */
  .bar{
    position:fixed; left:50%; top:20%; z-index:3;
    transform:translateX(-50%); transform-origin:bottom center;
    width:206px; height:156px; padding:9px;
    display:grid; grid-template-columns:repeat(4,1fr); grid-template-rows:repeat(4,1fr); gap:6px;
    border-radius:12px;
    background:linear-gradient(157deg,#6b4226 0%,#4a2814 32%,#2e1709 73%,#190c04 100%);
    box-shadow: inset 0 2px 3px rgba(255,212,168,.42), inset 0 -15px 24px rgba(0,0,0,.62),
                inset 0 0 0 1px rgba(0,0,0,.32), 0 18px 34px rgba(20,8,0,.6);
    will-change:transform;
  }
  .seg{ border-radius:4px;
    background:linear-gradient(157deg,#7c4b2b 0%,#4f2c17 50%,#2b1408 100%);
    box-shadow: inset 1.6px 1.6px 1px rgba(255,218,172,.52), inset -2px -2.6px 3px rgba(0,0,0,.6);
  }
  .gloss{ position:absolute; inset:0; grid-column:1/-1; grid-row:1/-1; border-radius:inherit; pointer-events:none;
    background:linear-gradient(118deg,transparent 40%,rgba(255,236,202,.22) 49%,transparent 58%);
    background-size:300% 300%; animation:sheen 6s linear infinite; mix-blend-mode:screen; }
  @keyframes sheen{ 0%{ background-position:165% 0 } 100%{ background-position:-65% 0 } }
  .plate{ position:absolute; inset:0; grid-column:1/-1; grid-row:1/-1; pointer-events:none;
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  .plate b{ font-size:13px; font-weight:800; letter-spacing:.01em; color:#e8c391;
    text-shadow:0 1.2px 0 rgba(0,0,0,.62), 0 -1px 0 rgba(255,224,176,.28); }
  .plate small{ margin-top:3px; font-size:8.5px; font-weight:600; color:#cda576; text-shadow:0 1px 0 rgba(0,0,0,.55); }

  .puddle{
    position:fixed; left:50%; top:80%; z-index:2;
    transform:translateX(-50%); transform-origin:center top;
    width:206px; height:44px; border-radius:50%;
    background:radial-gradient(58% 80% at 44% 28%, #6b4226 0%, #4a2814 40%, #190c04 100%);
    box-shadow:0 12px 28px rgba(20,8,0,.6), inset 0 4px 8px rgba(255,202,152,.22);
    will-change:transform;
  }
  .puddle::after{ content:''; position:absolute; left:26%; top:24%; width:30%; height:26%; border-radius:50%;
    background:radial-gradient(closest-side,rgba(255,236,206,.5),transparent 70%); filter:blur(1px); }

  .cap{ position:fixed; left:0; right:0; bottom:4%; z-index:4; text-align:center; padding:0 18px;
    text-shadow:0 1px 12px rgba(12,6,0,.8); }
  .cap .ded{ display:block; margin-bottom:7px; font-size:11px; letter-spacing:.22em; text-transform:uppercase; color:#ffd9a8; opacity:.9; }
  .cap .big{ font-size:15px; letter-spacing:.02em; color:#fff6e8; }
  .cap .small{ display:block; margin-top:7px; font-size:12px; color:#ffe7c4; opacity:.95; }
  .cap a{ color:#fff; text-decoration:none; border-bottom:1px solid rgba(255,255,255,.5); }
  .cap a:hover{ color:#ffe9c8; }

    <span class="small">the real view from mendoza, where the andes meet the vines. it starts full, the sun does the rest.
      <a href="/">back to ternlang.com</a></span>
  </p>

<script>
(function(){
  var bar = document.getElementById('bar'),
      puddle = document.getElementById('puddle'),
      c = document.getElementById('drips'), x = c.getContext('2d');
  var W, H; function size(){ W=c.width=innerWidth; H=c.height=innerHeight; } size(); addEventListener('resize', size);

  var drops = [], COL = ['#2a1409','#3a1f12','#4f2c17','#1d0e06'];
  var MELT = 44000, REFORM = 2600, CYCLE = MELT + REFORM, origin = null;
  function ease(t){ return t*t*(3-2*t); }

  function frame(ts){
    if (origin === null) origin = ts;
    var e = (ts - origin) % CYCLE, melt;
    if (e < MELT) melt = ease(e / MELT);
    else          melt = 1 - ease((e - MELT) / REFORM);

    var s = 1 - 0.84 * melt, sag = 1 - 0.07 * Math.sin(melt * Math.PI);
    bar.style.transform = 'translateX(-50%) scale(' + s.toFixed(3) + ',' + (s * sag).toFixed(3) + ')';
    bar.style.borderRadius = (10 + melt*26) + 'px ' + (10 + melt*26) + 'px ' + (14 + melt*64) + 'px ' + (14 + melt*58) + 'px';
    bar.style.filter = 'brightness(' + (1 + melt*0.12).toFixed(2) + ')';

    var pw = 0.34 + melt*1.75, ph = 0.42 + melt*1.05;
    puddle.style.transform = 'translateX(-50%) scale(' + pw.toFixed(3) + ',' + ph.toFixed(3) + ')';
    puddle.style.opacity = (0.42 + melt*0.55).toFixed(2);

    var bb = bar.getBoundingClientRect(), py = puddle.getBoundingClientRect().top + 4;
    if (Math.random() < 0.04 + melt*0.34) {
      drops.push({ x: bb.left + bb.width*(0.2 + Math.random()*0.6), y: bb.bottom - 4,
                   vy: 0.5 + Math.random()*0.7, r: (1.8 + Math.random()*3) * (0.5 + s*0.5),
                   col: COL[drops.length % 4], a: 0 });
      if (drops.length > 80) drops.shift();
    }
    x.clearRect(0, 0, W, H);
    for (var i=0; i<drops.length; i++){
      var d = drops[i]; d.vy += 0.02; d.y += d.vy; d.a = Math.min(1, d.a + 0.06);
      if (d.y > py){ drops.splice(i,1); i--; continue; }
      x.globalAlpha = d.a;
      x.beginPath(); x.moveTo(d.x, d.y - d.r*1.7);
      x.bezierCurveTo(d.x+d.r, d.y-d.r, d.x+d.r, d.y+d.r, d.x, d.y+d.r);
      x.bezierCurveTo(d.x-d.r, d.y+d.r, d.x-d.r, d.y-d.r, d.x, d.y-d.r*1.7);
      x.fillStyle = d.col; x.fill();
      x.globalAlpha = d.a*0.5; x.beginPath(); x.arc(d.x-d.r*0.3, d.y-d.r*0.2, d.r*0.3, 0, 6.3);
      x.fillStyle = 'rgba(255,228,194,.7)'; x.fill();
    }
    x.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
