[package]
name              = "ternlang-api"
description       = "ternlang.com Institutional API Gateway — Core REST interface for the Ternary Intelligence Stack. Powers /api/trit_decide, /api/trit_vector, and the TaaS mesh."
version.workspace = true
edition.workspace = true
license           = "LicenseRef-BSL-1.1"
repository.workspace = true
homepage.workspace   = true
authors.workspace    = true

[[bin]]
name = "ternlang-api"
path = "src/main.rs"

[dependencies]
axum            = { version = "0.8", features = ["ws"] }
tokio           = { version = "1", features = ["full"] }
tower           = "0.5"
tower-http      = { version = "0.6", features = ["cors", "trace", "fs"] }
serde           = { version = "1", features = ["derive"] }
serde_json      = "1"
uuid            = { version = "1", features = ["v4"] }
chrono          = { version = "0.4", features = ["serde"] }
ternlang-core   = { workspace = true }
ternlang-ml     = { workspace = true }
ternlang-moe    = { workspace = true }
tokio-stream    = "0.1"
reqwest         = { version = "0.12", features = ["json"] }
rusqlite        = { version = "0.32", features = ["bundled"] }
serde_rusqlite  = "0.36"
hmac            = "0.12"
sha2            = "0.10"
hex             = "0.4"
