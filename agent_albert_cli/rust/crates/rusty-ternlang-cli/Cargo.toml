[package]
name = "rusty-ternlang-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "ternlang-cli"
path = "src/main.rs"

[dependencies]
api = { path = "../api" }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
rustyline = "15"
runtime = { path = "../runtime" }
serde_json = "1"
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tools = { path = "../tools" }
dialoguer = "0.12.0"
console = "0.15"
indicatif = "0.17"
toml = "0.8"
dirs = "5"
serde = { version = "1", features = ["derive"] }

[lints]
workspace = true
