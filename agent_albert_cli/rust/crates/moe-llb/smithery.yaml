# Smithery MCP Registry — albert-llb
# Last Look Back Protocol — Deterministic Filesystem Safety Gate
#
# CLI:  npx @smithery/cli publish

name: albert-llb
displayName: "Last Look Back — Filesystem Safety Gate"
description: |
  **Deterministic filesystem containment for AI agents.**

  Modern AI agents (Claude Code, Cursor, Copilot, autonomous agents) are granted
  high-privilege access to local filesystems with no enforcement layer between the
  model's probabilistic intent and the host's deterministic disk. LLB fixes this.

  **Moves safety from the linguistic layer (system prompts) to the binary layer (Rust syscall boundary).**

  Every filesystem mutation becomes an atomic transaction:

  ```
  MutationRequest → Gate 1 → [Snapshot] → Execute → IOCC Gate 2 → Commit / Rollback
  ```

  **4 tools — runs 100% locally, no API key required:**

  - **llb_validate** — Gate 1 dry-run: check if a proposed mutation is safe before executing
  - **llb_classify** — Instant safety tier classification (T0/T1/T2/T3) for any path+operation
  - **llb_check** — Blacklist scanner: blocked paths (/etc /bin ~/.ssh) + forbidden binaries (rm, sudo, dd...)
  - **llb_write_safe** — Full LLB-protected file write: Gate 1 → Snapshot → Write → IOCC → Commit/Rollback

  **What LLB blocks:**
  - Path traversal (`../` injection)
  - Writes to `/etc`, `/bin`, `/sys`, `/proc`, `~/.ssh`, `~/.gnupg`, and other protected paths
  - Shell commands containing `rm`, `sudo`, `chmod`, `dd`, `shred`, `fdisk`, `mkfs`, `crontab`
  - Files created/modified with undeclared executable permissions (Gate 2)
  - Filesystem spillover — extra files appearing that the agent didn't declare (IOCC Gate 2)

  **Ternary decisions** (`+1` allow · `0` warn · `-1` hard veto) map directly to the
  [Ternary Intelligence Stack](https://ternlang.com) trit values.

  Built by RFI-IRFOS (ZVR: 1015608684) · Graz, Austria
  Part of the [Albert](https://crates.io/crates/albert-cli) sovereign AI agent stack.

