[package]
name = "albert-tools"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Tool execution layer for Albert CLI — file ops, bash, grep/glob search and MCP tool dispatch"
readme = "README.md"
keywords = ["ai", "cli", "tools", "mcp", "agent"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
api = { package = "albert-api", path = "../api", version = "1.1.3" }
runtime = { package = "albert-runtime", path = "../runtime", version = "1.1.3" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
walkdir = "2"
dirs = "5"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"

[lints]
workspace = true
