[package]
name = "albert-llb"
version = "1.3.2"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Last Look Back protocol — deterministic filesystem containment gate for sovereign AI agents"
readme = "README.md"
keywords = ["ai", "agent", "safety", "filesystem", "containment"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "llb_demo"
path = "src/bin/llb_demo.rs"

[[bin]]
name = "albert-llb-mcp"
path = "src/bin/albert-llb-mcp.rs"

[dependencies]
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"

[lints]
workspace = true
