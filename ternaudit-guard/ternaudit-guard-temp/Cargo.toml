[package]
name = "ternaudit-guard"
version = "1.2.6"
edition = "2024"
authors = ["Simeon Kepp <rfi.irfos@gmail.com>"]
description = "Enterprise SDK for EU AI Act-compliant audit logs, wrapping ternlang-mcp."
repository = "https://github.com/eriirfos-eng/ternary-intelligence-stack"
license = "LGPL-3.0-or-later"

[dependencies]
ternlang-mcp = { path = "../ternlang-root/ternlang-mcp", version = "1.2.6" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
colored = "2.1"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

