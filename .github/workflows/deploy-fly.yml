name: Deploy to Fly.io

on:
  push:
    branches: [ main ]
    paths:
      - 'ternlang-root/ternlang-web/**'
      - 'ternlang-root/ternlang-api/**'
      - 'ternlang-root/Dockerfile'
      - 'ternlang-root/fly.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy ternlang-api to Fly.io
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --config ternlang-root/fly.toml --dockerfile ternlang-root/Dockerfile
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
