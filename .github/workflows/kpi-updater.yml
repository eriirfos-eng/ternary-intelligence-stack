name: KPI Dashboard Updater

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Manual trigger

permissions:
  contents: read # No write — history stays clean

jobs:
  update-kpis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fetch existing KPI data from Fly.io
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          mkdir -p docs/kpi
          flyctl ssh sftp get --app ternlang-api /data/kpi/ternlang_kpi_log.json docs/kpi/ternlang_kpi_log.json || true
          flyctl ssh sftp get --app ternlang-api /data/kpi/ternlang_gh_traffic.json docs/kpi/ternlang_gh_traffic.json || true

      - name: Run KPI Generator
        env:
          KPI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_kpi.py

      - name: Push KPI data to Fly.io volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl ssh console --app ternlang-api -C "mkdir -p /data/kpi"
          flyctl ssh sftp put --app ternlang-api docs/kpi/index.html /data/kpi/index.html
          flyctl ssh sftp put --app ternlang-api docs/kpi/ternlang_kpi_log.json /data/kpi/ternlang_kpi_log.json
          flyctl ssh sftp put --app ternlang-api docs/kpi/ternlang_gh_traffic.json /data/kpi/ternlang_gh_traffic.json
