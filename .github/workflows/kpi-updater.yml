name: KPI Dashboard Updater

on:
  schedule:
    - cron: '0 * * * *' # Every hour
  workflow_dispatch: # Manual trigger

permissions:
  contents: read

jobs:
  update-kpis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fetch existing KPI data from API
        run: |
          mkdir -p docs/kpi
          curl -sf -o docs/kpi/ternlang_kpi_log.json    https://ternlang.com/kpi/ternlang_kpi_log.json    || true
          curl -sf -o docs/kpi/ternlang_gh_traffic.json https://ternlang.com/kpi/ternlang_gh_traffic.json || true

      - name: Run KPI Generator
        env:
          KPI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/generate_kpi.py

      - name: Push updated KPI data to API
        env:
          KPI_SECRET: ${{ secrets.KPI_SECRET }}
        run: |
          curl -sf -X POST https://ternlang.com/api/kpi/upload/index.html \
               -H "X-Kpi-Token: $KPI_SECRET" \
               -H "Content-Type: text/html" \
               --data-binary @docs/kpi/index.html
          curl -sf -X POST https://ternlang.com/api/kpi/upload/ternlang_kpi_log.json \
               -H "X-Kpi-Token: $KPI_SECRET" \
               -H "Content-Type: application/json" \
               --data-binary @docs/kpi/ternlang_kpi_log.json
          curl -sf -X POST https://ternlang.com/api/kpi/upload/ternlang_gh_traffic.json \
               -H "X-Kpi-Token: $KPI_SECRET" \
               -H "Content-Type: application/json" \
               --data-binary @docs/kpi/ternlang_gh_traffic.json
          # Upload Albert training telemetry if the file was committed in this run
          if [ -f albert-moe-13/dashboard/training_telemetry.json ]; then
            curl -sf -X POST https://ternlang.com/api/kpi/upload/training_telemetry.json \
                 -H "X-Kpi-Token: $KPI_SECRET" \
                 -H "Content-Type: application/json" \
                 --data-binary @albert-moe-13/dashboard/training_telemetry.json || true
          fi
