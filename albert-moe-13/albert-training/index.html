<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Albert-1B Command Center</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: 'Courier New', monospace; background: #050505; color: #00ff9d; padding: 10px; margin: 0; }
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 10px; height: 95vh; }
        .card { background: #111; padding: 15px; border: 1px solid #222; display: flex; flex-direction: column; }
        h2 { font-size: 0.9rem; margin: 0 0 10px 0; border-bottom: 1px solid #222; }
        canvas { flex-grow: 1; min-height: 0; }
        input, button { background: #000; color: #00ff9d; border: 1px solid #00ff9d; padding: 5px; margin: 2px; }
        #logs { font-size: 0.7rem; overflow-y: auto; height: 100px; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="card">
            <h2>1. TRAINING CONTROL</h2>
            <input type="number" id="lr" placeholder="LR (1e-4)">
            <input type="number" id="th" placeholder="Threshold (0.5)">
            <button onclick="startTraining()">INITIALIZE SWEEP</button>
            <div id="logs"></div>
        </div>
        <div class="card">
            <h2>2. MOE TRAFFIC MAP</h2>
            <canvas id="trafficChart"></canvas>
        </div>
        <div class="card">
            <h2>3. TENSOR HEALTH (GRADIENT NORMS)</h2>
            <canvas id="healthChart"></canvas>
        </div>
        <div class="card">
            <h2>4. SYSTEM TELEMETRY (IO/CPU)</h2>
            <canvas id="systemChart"></canvas>
        </div>
    </div>
    <script>
        const socket = io();
        const createChart = (id, label) => new Chart(document.getElementById(id), {
            type: 'line', data: { labels: [], datasets: [{ label, data: [], borderColor: '#00ff9d' }] },
            options: { responsive: true, maintainAspectRatio: false }
        });
        const tChart = new Chart(document.getElementById('trafficChart'), { type: 'bar', data: { labels: Array.from({length:13}, (_,i)=>'E'+i), datasets: [{ data: Array(13).fill(0), backgroundColor: '#00ff9d' }] } });
        const hChart = createChart('healthChart', 'Norms');
        const sChart = createChart('systemChart', 'IO/s');

        socket.on('log', (msg) => { document.getElementById('logs').innerHTML += msg.data + '<br>'; });
        
        setInterval(() => {
            fetch('/api/telemetry').then(r => r.json()).then(d => {
                tChart.data.datasets[0].data = d.experts;
                tChart.update();
                hChart.data.datasets[0].data.push(d.grad_norm);
                hChart.update();
                sChart.data.datasets[0].data.push(d.io);
                sChart.update();
            });
        }, 1000);
        function startTraining() { socket.emit('start_training', {lr: document.getElementById('lr').value, th: document.getElementById('th').value}); }
    </script>
</body>
</html>
