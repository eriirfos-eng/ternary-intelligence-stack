[package]
name = "moe-platform"
version = "1.1.0"
edition = "2021"
description = "Stable API for MoE-13 ternary inference and model ingestion."
license = "MIT"
repository = "https://github.com/eriirfos-eng/ternary-intelligence-stack"
documentation = "https://docs.rs/moe-platform"

[lib]
path = "src/lib.rs"

[dependencies]
anyhow = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = "1.0"
moe-core = { path = "../moe-core", version = "1.1.0" }
ternlang-ml = { path = "../../../ternlang-root/ternlang-ml", version = "1.2.9" }
