[package]
name = "moe-plugin-sdk"
version = "1.3.6"
edition = "2024"
description = "Stable SDK for building third-party MoE-13 inference plugins."
license = "LGPL-3.0-or-later"
repository = "https://github.com/eriirfos-eng/ternary-intelligence-stack"
documentation = "https://docs.rs/moe-plugin-sdk"

[dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
semver = { version = "1.0", features = ["serde"] }
# Access internal core types without re-exporting internal logic
moe-core = { path = "../moe-core", version = "1.3.6" }
ternlang-moe = { path = "../../../ternlang-root/ternlang-moe", version = "1.3.6" }
