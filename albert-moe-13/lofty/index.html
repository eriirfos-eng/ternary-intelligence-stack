<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lofty</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:#0d1117;color:#e2e8f0;
  min-height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:28px 20px;
  gap:0;
}
h1{font-size:1.6rem;font-weight:700;letter-spacing:-.5px}
.sub{font-size:.78rem;color:#475569;margin-top:3px;margin-bottom:32px}

.ring{
  width:140px;height:140px;border-radius:50%;
  border:2.5px solid #1e293b;
  display:flex;align-items:center;justify-content:center;
  flex-direction:column;gap:4px;
  margin-bottom:32px;
  transition:border-color .4s,box-shadow .4s;
  font-size:.72rem;color:#475569;text-align:center;padding:20px;
  line-height:1.4;
}
.ring.scanning {border-color:#f59e0b;box-shadow:0 0 20px #f59e0b33;color:#f59e0b;
  animation:pulse 1.2s infinite}
.ring.connected{border-color:#22d3ee;box-shadow:0 0 26px #22d3ee44;color:#22d3ee}
.ring.unlocked {border-color:#4ade80;box-shadow:0 0 32px #4ade8055;color:#4ade80}
.ring.locked   {border-color:#64748b;box-shadow:none;color:#64748b}
.ring.error    {border-color:#f87171;box-shadow:0 0 20px #f8717133;color:#f87171}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

.ring-icon{font-size:2rem;line-height:1}

.cfg{width:100%;max-width:300px;margin-bottom:20px}
.cfg label{font-size:.72rem;color:#475569;display:block;margin-bottom:5px}
.cfg input{
  width:100%;background:#161b22;
  border:1px solid #30363d;border-radius:8px;
  color:#e2e8f0;padding:11px 13px;font-size:.9rem;
  outline:none;transition:border-color .2s;
}
.cfg input:focus{border-color:#22d3ee}

.btn{
  width:100%;max-width:300px;padding:15px;
  border-radius:12px;border:none;
  font-size:1rem;font-weight:600;cursor:pointer;
  transition:opacity .2s,transform .1s;
  margin-bottom:10px;
}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:default}
.btn-unlock{background:#22d3ee;color:#0d1117}
.btn-lock  {background:#161b22;color:#64748b;border:1px solid #30363d}

.log{
  margin-top:18px;width:100%;max-width:340px;
  background:#161b22;border:1px solid #21262d;
  border-radius:10px;padding:12px;
  font-size:.68rem;font-family:'Courier New',monospace;
  color:#6e7681;max-height:160px;overflow-y:auto;line-height:1.65;
}
.log .ok {color:#4ade80}
.log .err{color:#f87171}
.log .rx {color:#f59e0b}
</style>
</head>
<body>

<h1>Lofty</h1>
<p class="sub">Zabih's scooter — offline BLE unlock</p>

<div class="ring" id="ring">
  <span class="ring-icon">&#9651;</span>
  <span id="ring-txt">tap unlock</span>
</div>

<div class="cfg">
  <label>Registered phone number</label>
  <input type="tel" id="phone" value="67764823881" autocomplete="off">
</div>

<button class="btn btn-unlock" id="btnUnlock" onclick="doUnlock()">Unlock</button>
<button class="btn btn-lock"   id="btnLock"   onclick="doLock()"   disabled>Lock + disconnect</button>

<div class="log" id="log"></div>

<script>
// ── BLE UUIDs ────────────────────────────────────────────────────────────────
const SVC        = '0000fff0-0000-1000-8000-00805f9b34fb';
const CHR_NOTIFY = '0000fff1-0000-1000-8000-00805f9b34fb';
const CHR_WRITE  = '0000fff2-0000-1000-8000-00805f9b34fb';

// Global BLE device auth key — hardcoded in Jida APK v2.1.5 app-service.js
const DEVICE_KEY = [0x0b,0xf2,0xda,0x3e,0xef,0xf4,0xef,0x82,
                    0x34,0x03,0xb9,0x97,0xfa,0x2b,0x5c,0x52];

// Phone encryption key — also hardcoded in APK (encryptionData function)
const PHONE_KEY  = new Uint8Array([17,18,19,20,17,18,19,20,17,18,19,20,17,18,19,20]);

// ── State ─────────────────────────────────────────────────────────────────────
let gatt = null, writeChar = null;

// ── UI helpers ─────────────────────────────────────────────────────────────────
function log(msg, cls) {
  const el = document.getElementById('log');
  const d  = document.createElement('div');
  if (cls) d.className = cls;
  d.textContent = msg;
  el.appendChild(d);
  el.scrollTop = el.scrollHeight;
}

function setRing(text, cls) {
  document.getElementById('ring-txt').textContent = text;
  document.getElementById('ring').className = 'ring' + (cls ? ' ' + cls : '');
}

function h2(b) { return b < 16 ? '0' + b.toString(16) : b.toString(16); }

// ── AES-128-ECB for single 16-byte block ──────────────────────────────────────
// ECB(block) = CBC(block, IV=0)[0:16]
async function aes128ecb(block16, keyBytes) {
  const key = await crypto.subtle.importKey(
    'raw', keyBytes, {name:'AES-CBC'}, false, ['encrypt']);
  const ct = await crypto.subtle.encrypt(
    {name:'AES-CBC', iv: new Uint8Array(16)}, key, block16);
  return new Uint8Array(ct).slice(0, 16);
}

// ── Protocol framing (mirrors Jida getCmd) ────────────────────────────────────
// Frame: [0x88, 0x01, payload.length+1, ...payload, checksum]
// Checksum: sum of all preceding bytes mod 256
function getCmd(payload) {
  const frame = [0x88, 0x01, (payload.length + 1) & 0xFF, ...payload];
  const ck = frame.reduce((a, b) => (a + b) & 0xFF, 0);
  frame.push(ck);
  return new Uint8Array(frame);
}

// ── Auth command builder ──────────────────────────────────────────────────────
// Mirrors Jida's c(phone) + getSystemTimeHex() + getAuthCarCmd()
async function buildAuthCmd(phone) {
  const digits  = phone.replace(/\D/g, '');
  // pad(parseInt(digits).toString(16), 16) — 8 bytes, big-endian
  const phoneHex = parseInt(digits).toString(16).padStart(16, '0');

  // doubled 16-byte block: same 8 bytes twice (n + n in Jida source)
  const block = new Uint8Array(16);
  for (let i = 0; i < 8; i++) {
    const b = parseInt(phoneHex.slice(i * 2, i * 2 + 2), 16);
    block[i] = b; block[i + 8] = b;
  }
  const enc = await aes128ecb(block, PHONE_KEY);

  // timestamp: [year_hi, year_lo, month, day, hour, min, sec]
  const now = new Date();
  const y   = now.getFullYear().toString().padStart(4, '0');
  const ts  = [
    parseInt(y.slice(0, 2)), parseInt(y.slice(2, 4)),
    now.getMonth() + 1, now.getDate(),
    now.getHours(), now.getMinutes(), now.getSeconds()
  ];

  // payload: 00 01 16 27 | 16-byte device key | 16-byte enc phone | 7-byte timestamp
  const payload = [0x00, 0x01, 0x16, 0x27, ...DEVICE_KEY, ...enc, ...ts];
  return getCmd(payload);
}

// ── BLE write helper ──────────────────────────────────────────────────────────
async function write(bytes) {
  if (!writeChar) throw new Error('no write characteristic');
  log('tx ' + Array.from(bytes).map(h2).join(' '));
  await writeChar.writeValueWithoutResponse(bytes);
}

// ── Notification handler ──────────────────────────────────────────────────────
function onNotify(ev) {
  const v = new Uint8Array(ev.target.value.buffer);
  log('rx ' + Array.from(v).map(h2).join(' '), 'rx');
  // cmd byte is index 3: 0x17 = auth response, 0x1b = start/stop response
  if (v[3] === 0x17) {
    const ok = v[4] === 0x00;
    log(ok ? 'auth OK' : 'auth FAIL (code ' + h2(v[4]) + ')', ok ? 'ok' : 'err');
  }
  if (v[3] === 0x1b) {
    const ok = v[4] === 0x00 || v[4] === 0x01;
    log(ok ? 'start/stop ACK' : 'start/stop NACK', ok ? 'ok' : 'err');
  }
}

// ── Main flow ─────────────────────────────────────────────────────────────────
async function doUnlock() {
  const phone = document.getElementById('phone').value.trim();
  if (!phone) { log('enter phone number', 'err'); return; }

  document.getElementById('btnUnlock').disabled = true;
  setRing('scanning…', 'scanning');

  try {
    log('requesting device (pick jida_bike)…');
    const device = await navigator.bluetooth.requestDevice({
      filters: [{ services: [SVC] }]
    });
    log('found: ' + (device.name || device.id));
    setRing('connecting…', 'scanning');

    gatt = await device.gatt.connect();
    log('GATT connected', 'ok');
    setRing(device.name || 'connected', 'connected');

    const svc = await gatt.getPrimaryService(SVC);
    writeChar  = await svc.getCharacteristic(CHR_WRITE);

    const notifyChar = await svc.getCharacteristic(CHR_NOTIFY);
    await notifyChar.startNotifications();
    notifyChar.addEventListener('characteristicvaluechanged', onNotify);
    log('notifications on');

    // status query (Jida sends this right after notify enable)
    await write(getCmd([0x00, 0x01, 0x27, 0x00]));
    await sleep(300);

    // auth
    log('authenticating…');
    const auth = await buildAuthCmd(phone);
    await write(auth);
    await sleep(600);

    // unlock
    log('unlocking…');
    await write(getCmd([0x00, 0x01, 0x1b, 0x01, 0x01]));

    setRing('unlocked', 'unlocked');
    document.getElementById('btnLock').disabled = false;
    log('done — ride safe', 'ok');

  } catch (e) {
    log('error: ' + e.message, 'err');
    setRing('error', 'error');
    document.getElementById('btnUnlock').disabled = false;
  }
}

async function doLock() {
  document.getElementById('btnLock').disabled = true;
  try {
    log('locking…');
    await write(getCmd([0x00, 0x01, 0x1b, 0x01, 0x00]));
    await sleep(300);
    await write(getCmd([0x00, 0x01, 0x12, 0x00]));
    if (gatt) gatt.disconnect();
    gatt = null; writeChar = null;
    setRing('locked', 'locked');
    log('locked + disconnected', 'ok');
    document.getElementById('btnUnlock').disabled = false;
  } catch (e) {
    log('error: ' + e.message, 'err');
    document.getElementById('btnLock').disabled = false;
  }
}

function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// Check Web Bluetooth support on load
if (!navigator.bluetooth) {
  log('Web Bluetooth not available — needs Chrome/Chromium on Android/desktop', 'err');
  log('On Chrome: chrome://flags → enable Experimental Web Platform Features', 'err');
  document.getElementById('btnUnlock').disabled = true;
}
</script>
</body>
</html>
