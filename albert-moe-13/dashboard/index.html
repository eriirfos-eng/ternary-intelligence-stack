<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Albert MoE-13 Live Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1/dist/chartjs-plugin-zoom.min.js"></script>
    <style>
        body { background: #000000; color: #ffffff; font-family: 'Courier New', Courier, monospace; margin: 0; padding: 20px; overflow: hidden; }
        #chart-container { width: 96vw; height: 82vh; margin: auto; position: relative; border: 1px solid #333; background: #000; cursor: grab; }
        #chart-container:active { cursor: grabbing; }
        h1 { text-align: center; color: #ffffff; font-size: 1.8rem; letter-spacing: 5px; margin: 0 0 15px 0; text-transform: uppercase; font-weight: bold; }
        .controls { text-align: center; margin-bottom: 20px; display: flex; justify-content: center; align-items: center; gap: 20px; font-size: 1.1rem; }
        select, button { background: #111; color: #00ffcc; border: 2px solid #00ffcc; padding: 8px 20px; font-family: inherit; cursor: pointer; border-radius: 4px; font-size: 1rem; transition: all 0.2s; font-weight: bold; }
        button:hover { background: #00ffcc; color: #000; }
        .hint { text-align: center; color: #ffffff; font-size: 0.9rem; margin-top: 10px; letter-spacing: 2px; font-weight: bold; }
        #status-bar { text-align: center; font-size: 1.1rem; margin-bottom: 10px; font-weight: bold; letter-spacing: 1px; }
        #status-bar.live { color: #ff9900; }
        #status-bar.standby { color: #666; }
        label { color: #ffffff; font-weight: bold; }
    </style>
</head>
<body>
    <h1>MoE-13 v2.2: AUTO-EVOLUTIONARY (13-NODE)</h1>
    <div id="status-bar" class="standby">STATUS: WAITING FOR TRAINING LOG...</div>

    <div class="controls">
        <label for="viewFilter">TIME WINDOW:</label>
        <select id="viewFilter">
            <option value="all" selected>COMPLETE LOG</option>
            <option value="100">100 EPOCHS</option>
            <option value="50">50 EPOCHS</option>
            <option value="10">10 EPOCHS (FOCUS)</option>
        </select>
        <button id="resetBtn">CENTER CAMERA</button>
    </div>

    <div id="chart-container">
        <canvas id="lossChart"></canvas>
    </div>
    <div class="hint">DRAG: PAN | SCROLL: ZOOM | NEW BATCHES DROP FROM SKY</div>

    <script>
        // Must match accumulation_steps in train_bible.rs — the log writes
        // step_loss * ACCUMULATION_STEPS, so we divide here to recover real loss.
        const ACCUMULATION_STEPS = 16;

        const ctx = document.getElementById('lossChart').getContext('2d');
        const viewFilter = document.getElementById('viewFilter');
        const resetBtn = document.getElementById('resetBtn');
        const statusBar = document.getElementById('status-bar');

        let manualMode = false;
        let isFirstLoad = true;
        let seenKeys = new Set();
        let lastNewPointTime = null;

        const lossChart = new Chart(ctx, {
            data: {
                datasets: [
                    {
                        type: 'scatter',
                        label: 'BATCH LOSS (TURQUOISE)',
                        data: [],
                        backgroundColor: '#00ffcc',
                        pointRadius: 4,
                        order: 2,
                        animations: {
                            y: {
                                from: (ctx) => ctx.raw && ctx.raw._sp ? undefined : 0,
                                duration: (ctx) => ctx.raw && ctx.raw._sp ? 0 : 800,
                                easing: 'easeOutBounce'
                            }
                        }
                    },
                    {
                        type: 'line',
                        label: 'CONVERGENCE TREND (ORANGE)',
                        data: [],
                        borderColor: '#ff9900',
                        borderWidth: 2,
                        fill: false,
                        pointRadius: 0,
                        tension: 0.4,
                        order: 1,
                        animations: { y: { duration: 0 } }
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: { duration: 0 },
                scales: {
                    x: {
                        type: 'linear',
                        title: { display: true, text: 'GLOBAL EPOCH (BATCH PRECISION)', color: '#ffffff', font: { size: 14, weight: 'bold' } },
                        grid: { color: '#222' },
                        ticks: { color: '#ffffff', font: { size: 12, weight: 'bold' } }
                    },
                    y: {
                        title: { display: true, text: 'LOSS', color: '#ffffff', font: { size: 14, weight: 'bold' } },
                        grid: { color: '#222' },
                        ticks: { color: '#ffffff', font: { size: 12, weight: 'bold' } }
                    }
                },
                plugins: {
                    legend: {
                        labels: {
                            color: '#ffffff',
                            font: { family: 'monospace', size: 12, weight: 'bold' },
                            padding: 20
                        }
                    },
                    tooltip: {
                        enabled: true,
                        backgroundColor: '#000',
                        titleFont: { size: 14, weight: 'bold' },
                        bodyFont: { size: 12 },
                        callbacks: {
                            label: (c) => ` EPOCH: ${c.parsed.x.toFixed(2)} | LOSS: ${c.parsed.y.toFixed(4)}`
                        }
                    },
                    zoom: {
                        pan: {
                            enabled: true,
                            mode: 'xy',
                            threshold: 5,
                            onPanStart: () => { manualMode = true; }
                        },
                        zoom: {
                            wheel: { enabled: true },
                            pinch: { enabled: true },
                            mode: 'xy',
                            onZoomStart: () => { manualMode = true; }
                        }
                    }
                }
            }
        });

        function calculateSMA(data, windowSize) {
            const sma = [];
            for (let i = 0; i < data.length; i++) {
                const start = Math.max(0, i - windowSize + 1);
                const avg = data.slice(start, i + 1).reduce((a, b) => a + b.y, 0) / (i - start + 1);
                sma.push({ x: data[i].x, y: avg });
            }
            return sma;
        }

        async function updateData() {
            try {
                let fetchOptions = { cache: "no-store" };
                if (!isFirstLoad) {
                    fetchOptions.headers = { 'Range': 'bytes=-50000' };
                }

                const response = await fetch('training.log?t=' + Date.now(), fetchOptions);
                if (!response.ok && response.status !== 206) return;

                const text = await response.text();
                const lines = text.split('\n').filter(l => l.trim() !== "");

                let logData = [];
                lines.forEach(line => {
                    const m = line.match(/Global\s+(\d+)\),\s+Batch\s+(\d+):\s+loss\s*=\s*([\d.]+)/);
                    if (m) {
                        const globalEpoch = m[1];
                        const batchIdx = m[2];
                        // Divide by ACCUMULATION_STEPS to recover the true averaged loss
                        const loss = parseFloat(m[3]) / ACCUMULATION_STEPS;
                        const key = `${globalEpoch}_${batchIdx}`;
                        const x = parseFloat(globalEpoch) + (parseFloat(batchIdx) / 300);
                        logData.push({ x, y: loss, key });
                    }
                });

                if (logData.length === 0) return;

                const chartPoints = lossChart.data.datasets[0].data;
                const newPoints = [];

                logData.forEach(p => {
                    if (!seenKeys.has(p.key)) {
                        newPoints.push(p);
                        seenKeys.add(p.key);
                    }
                });

                if (newPoints.length > 0 || isFirstLoad) {
                    if (isFirstLoad) {
                        newPoints.forEach(p => p._sp = true);
                        chartPoints.push(...newPoints);
                        isFirstLoad = false;
                        lossChart.update('none');
                    } else {
                        newPoints.forEach(p => {
                            p._sp = false;
                            chartPoints.push(p);
                        });

                        if (chartPoints.length > 5000) {
                            chartPoints.splice(0, chartPoints.length - 5000);
                        }

                        lossChart.update({ duration: 800 });
                        setTimeout(() => { newPoints.forEach(p => p._sp = true); }, 1000);
                    }

                    chartPoints.sort((a, b) => a.x - b.x);
                    lossChart.data.datasets[1].data = calculateSMA(chartPoints, 20);

                    if (newPoints.length > 0) lastNewPointTime = Date.now();
                }

                // Status bar: show LIVE if we got new points in last 10s, else STANDBY
                const latest = logData[logData.length - 1];
                const isLive = lastNewPointTime && (Date.now() - lastNewPointTime < 10000);
                if (isLive) {
                    statusBar.className = 'live';
                    statusBar.innerText = `STATUS: LIVE // EPISTEMIC ROUTING ACTIVE // POINTS: ${chartPoints.length} // EPOCH: ${latest.x.toFixed(2)} // LOSS: ${latest.y.toFixed(4)}`;
                } else {
                    statusBar.className = 'standby';
                    statusBar.innerText = `STATUS: STANDBY // POINTS: ${chartPoints.length} // LAST EPOCH: ${latest.x.toFixed(2)} // LAST LOSS: ${latest.y.toFixed(4)}`;
                }

                if (!manualMode && chartPoints.length > 0) {
                    const filterVal = viewFilter.value;
                    const maxEpoch = chartPoints[chartPoints.length - 1].x;
                    const minEpoch = filterVal === 'all' ? 0 : Math.max(0, maxEpoch - parseInt(filterVal));
                    lossChart.options.scales.x.min = minEpoch;
                    lossChart.options.scales.x.max = maxEpoch + (filterVal === 'all' ? 5 : 2);
                    lossChart.update('none');
                }
            } catch (e) { console.error("SYNC_FAIL", e); }
        }

        resetBtn.addEventListener('click', () => {
            manualMode = false;
            lossChart.resetZoom();
            updateData();
        });

        viewFilter.addEventListener('change', () => { manualMode = false; updateData(); });

        updateData();
        setInterval(updateData, 3000);
    </script>
</body>
</html>
