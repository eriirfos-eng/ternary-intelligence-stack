# Build-only workspace manifest for the ternlang-api Docker image.
#
# The real root Cargo.toml is a mega-workspace that also includes pytern,
# ternaudit-guard, and the albert-moe-13/* crates. The Docker build cannot copy
# albert-moe-13 (it carries ~859 MB of model weights), and `cargo build -p
# ternlang-api` refuses to load a workspace whose member dirs are absent. None of
# the ternlang crates depend on those packages, so the image build uses THIS trimmed
# member list (ternlang crates only). The real Cargo.toml is left untouched, so local
# albert + full-workspace builds are unaffected.
#
# Keep [workspace.package] and [workspace.dependencies] in sync with ./Cargo.toml.
[workspace]
members = [
    "ternlang-root/ternlang-ruvector",
    "ternlang-root/compiler/legacy_shim/ternlang-core",
    "ternlang-root/compiler/legacy_shim/ternlang-codegen",
    "ternlang-root/compiler/legacy_shim/ternlang-cli",
    "ternlang-root/compiler/legacy_shim/ternlang-runtime",
    "ternlang-root/ternlang-ml",
    "ternlang-root/ternlang-api",
    "ternlang-root/ternlang-gate",
    "ternlang-root/ternlang-mkl",
    "ternlang-root/ternlang-hft",
    "ternlang-root/ternlang-ros2",
    "ternlang-root/ternlang-edu",
    "ternlang-root/ternlang-harmony",
    "ternlang-root/ternlang-driver",
]
resolver = "2"

[workspace.package]
version     = "1.5.0"
edition     = "2024"
license     = "LGPL-3.0-or-later"
repository  = "https://github.com/eriirfos-eng/ternary-intelligence-stack"
homepage    = "https://ternlang.com"
authors     = [
    "Simeon Kepp <s.kepp@ternlang.com>",
    "Nikoletta Csonka <csonikoletta@ternlang.com>",
    "Zabih Karimi <z.karimi@ternlang.com>",
    "RFI-IRFOS <licensing@ternlang.com>"
]
keywords    = [
    "ternary-logic", "machine-learning", "inference-engine", "compiler",
    "ai-safety", "explainable-ai", "sparsity", "rust-lang", "low-latency",
    "post-binary", "quantization", "hpc", "deterministic"
]
categories  = ["compilers", "science", "embedded-programming", "development-tools::ffi"]

[workspace.dependencies]
ternlang-core    = { path = "ternlang-root/compiler/legacy_shim/ternlang-core",    version = "1.5.0" }
ternlang-codegen = { path = "ternlang-root/compiler/legacy_shim/ternlang-codegen", version = "1.5.0" }
ternlang-runtime = { path = "ternlang-root/compiler/legacy_shim/ternlang-runtime", version = "1.5.0" }
ternlang-cli     = { path = "ternlang-root/compiler/legacy_shim/ternlang-cli",     version = "1.5.0" }
ternlang-ml      = { path = "ternlang-root/ternlang-ml",      version = "1.5.0" }
ternlang-moe     = { path = "ternlang-root/ternlang-moe",     version = "1.5.0" }
ternlang-hdl     = { path = "ternlang-root/ternlang-hdl",     version = "1.5.0" }
ternlang-lsp     = { path = "ternlang-root/ternlang-lsp",     version = "1.5.0" }
ternlang-mcp     = { path = "ternlang-root/ternlang-mcp",     version = "1.5.0" }
ternpkg          = { path = "ternlang-root/ternpkg",          version = "1.5.0" }
ternlang-compat  = { path = "ternlang-root/ternlang-compat",  version = "1.5.0" }
ternlang-test    = { path = "ternlang-root/ternlang-test",    version = "1.5.0" }
ternlang-api     = { path = "ternlang-root/ternlang-api",     version = "1.5.0" }
ternlang-compress = { path = "ternlang-root/ternlang-compress", version = "1.5.0" }
