<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Albert-1B Live Cockpit</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
    <style>
        body { font-family: monospace; background: #000; color: #0f0; padding: 20px; }
        .card { background: #111; padding: 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        button { background: #0f0; color: #000; border: none; padding: 10px 20px; cursor: pointer; font-weight: bold; }
        #logs { height: 300px; overflow-y: scroll; background: #000; padding: 10px; border: 1px solid #0f0; }
    </style>
</head>
<body>
    <h1>Albert-1B Frontier Cockpit</h1>
    <div class="card">
        <button id="startBtn">INITIATE TRAINING RUN</button>
        <p id="status">STATUS: STANDBY</p>
    </div>
    <div class="card">
        <h2>Live Telemetry Stream</h2>
        <div id="logs"></div>
    </div>
    <script>
        const socket = io();
        const logs = document.getElementById('logs');
        const startBtn = document.getElementById('startBtn');
        const status = document.getElementById('status');

        startBtn.onclick = () => socket.emit('start_training');
        
        socket.on('log', (msg) => {
            logs.innerHTML += msg.data + '<br>';
            logs.scrollTop = logs.scrollHeight;
        });

        socket.on('status', (msg) => {
            status.innerText = 'STATUS: ' + msg.data;
        });
    </script>
</body>
</html>
