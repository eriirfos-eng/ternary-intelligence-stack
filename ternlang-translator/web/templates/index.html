<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TernTranslator | Local Code Migration Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            studio_bg: '#0A0E17',       
            studio_panel: '#111622',      
            studio_border: '#1E2536',    
            studio_editor: '#06080D',
            t_teal: '#00d4aa',
            t_teal_dim: 'rgba(0, 212, 170, 0.15)',
            t_blue: '#4a9eff',
            t_muted: '#64748B',    
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    /* Studio Grid Background */
    body {
      background-color: #0A0E17;
      background-image: radial-gradient(#1E2536 1px, transparent 1px);
      background-size: 24px 24px;
      color: #E2E8F0;
    }
    
    /* Sleek Glassmorphism */
    .glass-panel {
      background: rgba(17, 22, 34, 0.65);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid #1E2536;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    }

    /* Recessed Editor Panes */
    .editor-pane {
      background: #06080D;
      box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    textarea:focus { 
      outline: none; 
    }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #1E2536; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #334155; }
    
    /* Neon glow transitions */
    .btn-glow:hover {
      box-shadow: 0 0 15px rgba(0, 212, 170, 0.3);
      background: rgba(0, 212, 170, 0.1);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

  <div class="max-w-7xl w-full">
    <!-- Header -->
    <header class="text-center mb-10">
      <div class="inline-block px-3 py-1 mb-4 rounded-full border border-studio_border bg-studio_panel font-mono text-t_teal text-[10px] tracking-widest uppercase shadow-sm">
        Local Tool &middot; Ternary Intelligence Stack
      </div>
      <h1 class="text-4xl md:text-5xl font-bold text-white mb-3 tracking-tight">
        Tern<span class="text-t_teal">Translator</span>
      </h1>
      <p class="text-t_muted text-sm md:text-base">Migrate binary logic to balanced ternary syntax instantly.</p>
    </header>

    <!-- Main Workspace -->
    <div class="glass-panel rounded-xl overflow-hidden flex flex-col">
      
      <!-- Top Toolbar -->
      <div class="flex flex-col md:flex-row border-b border-studio_border bg-studio_panel/80 px-5 py-3 items-center justify-between gap-4">
        
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-t_teal animate-pulse"></div>
            <span class="text-t_muted font-mono text-[10px] uppercase tracking-widest">Source Engine</span>
          </div>
          <select id="trans-lang" class="bg-studio_editor border border-studio_border text-gray-300 focus:text-t_teal focus:border-t_teal transition-colors font-mono text-xs px-3 py-1.5 rounded-md outline-none">
            <option value="python">Python</option>
            <option value="rust">Rust</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="javascript">JavaScript</option>
          </select>
          
          <div class="h-4 w-px bg-studio_border hidden md:block"></div>
          
          <label class="cursor-pointer flex items-center gap-2 text-t_muted hover:text-white transition-colors font-mono text-xs group">
            <svg class="w-4 h-4 group-hover:text-t_blue transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <span>Upload</span>
            <input type="file" id="trans-upload" class="hidden" accept=".py,.rs,.java,.cpp,.js,.ts,.html">
          </label>
        </div>

        <button id="trans-run-btn" class="w-full md:w-auto flex items-center justify-center gap-2 px-6 py-2 border border-t_teal/50 text-t_teal font-mono text-xs font-bold uppercase tracking-wider rounded-md transition-all btn-glow bg-t_teal_dim">
          <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          Translate Output
        </button>
      </div>

      <!-- Code Areas -->
      <div class="grid md:grid-cols-2 h-[550px] divide-y md:divide-y-0 md:divide-x divide-studio_border">
        
        <!-- Input -->
        <div class="flex flex-col relative group">
          <div class="absolute top-3 right-4 font-mono text-[10px] text-t_muted uppercase tracking-widest z-10 select-none">Input // Binary</div>
          <textarea id="trans-input" class="editor-pane flex-1 w-full p-5 pt-10 font-mono text-sm text-gray-400 resize-none" spellcheck="false" placeholder="// Paste standard binary architecture here..."></textarea>
        </div>
        
        <!-- Output -->
        <div class="flex flex-col relative">
          <div class="absolute top-3 right-4 font-mono text-[10px] text-t_teal uppercase tracking-widest z-10 select-none">Output // Ternary</div>
          <div id="trans-output" class="editor-pane flex-1 w-full p-5 pt-10 font-mono text-sm text-t_teal overflow-auto whitespace-pre"></div>
        </div>
        
      </div>

      <!-- Insight Footer -->
      <div class="bg-studio_panel/90 border-t border-studio_border p-5">
        <div class="flex items-center gap-2 mb-3">
          <svg class="w-4 h-4 text-t_blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <h4 class="text-white font-mono text-[10px] uppercase tracking-widest">Topology Insights</h4>
        </div>
        <div id="trans-insight" class="flex flex-wrap gap-2 text-xs text-t_muted">
          <div class="px-3 py-1.5 bg-studio_editor border border-studio_border rounded text-[10px] font-mono">Awaiting logic vectors...</div>
        </div>
      </div>
    </div>

    <!-- Minimal Footer -->
    <footer class="mt-8 text-center text-[#475569] font-mono text-[10px] uppercase tracking-[0.2em]">
      &copy; 2026 RFI-IRFOS &middot; Balanced Ternary Systems &middot; v2.0.0
    </footer>
  </div>

  <script>
    const transInput = document.getElementById('trans-input');
    const transOutput = document.getElementById('trans-output');
    const transInsight = document.getElementById('trans-insight');
    const transBtn = document.getElementById('trans-run-btn');
    const transUpload = document.getElementById('trans-upload');

    const TERN_RULES = [
      { regex: /bool/g, repl: 'trit', note: 'Mapped binary bool to triadic trit.' },
      { regex: /true/g, repl: 'affirm', note: 'Mapped true to +1 (affirm).' },
      { regex: /false/g, repl: 'reject', note: 'Mapped false to -1 (reject).' },
      { regex: /None|null|undefined/g, repl: 'tend', note: 'Mapped null/empty to 0 (tend).' },
      { regex: /if\s*\((.*)\)\s*\{/g, repl: 'match $1 {', note: 'Converted if-statement to exhaustive match block.' },
      { regex: /if\s+(.*):/g, repl: 'match $1 {', note: 'Python-style if converted to match.' },
      { regex: /else\s*\{|else:/g, repl: 'tend => { // auto-injected safety hold\n    }\n    reject => {', note: 'Injected state 0 (tend) for logic exhaustiveness.' },
      { regex: /return\s+1|return\s+True/gi, repl: 'return affirm', note: 'Normalised positive return.' },
      { regex: /return\s+0|return\s+False/gi, repl: 'return reject', note: 'Normalised negative return.' },
      { regex: /void|def|fn/g, repl: 'fn', note: 'Unified function declaration.' },
    ];

    function translate() {
      let code = transInput.value;
      if (!code.trim()) return;

      transBtn.disabled = true;
      transBtn.innerHTML = '<svg class="w-4 h-4 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Parsing...';
      
      const insights = new Set();
      let translated = code;

      TERN_RULES.forEach(rule => {
        if (rule.regex.test(translated)) {
          translated = translated.replace(rule.regex, rule.repl);
          insights.add(rule.note);
        }
      });

      if (!translated.includes('fn main')) {
        translated = "// Translated via Ternlang BET VM Protocol\n\n" + translated;
      }

      setTimeout(() => {
        transOutput.textContent = translated;
        
        if (insights.size > 0) {
          transInsight.innerHTML = Array.from(insights).map(note => 
            `<div class="px-3 py-1.5 bg-studio_editor border border-studio_border/50 rounded flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-t_teal"></span>
              <span class="text-gray-400 font-mono text-[10px]">${note}</span>
            </div>`
          ).join('');
        } else {
          transInsight.innerHTML = `<div class="px-3 py-1.5 bg-studio_editor border border-studio_border/50 rounded font-mono text-[10px] text-gray-400">System baseline logic detected. No triadic morphing required.</div>`;
        }
        
        transBtn.disabled = false;
        transBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Translate Output';
        transOutput.scrollTop = 0;
      }, 400);
    }

    transBtn.addEventListener('click', translate);

    transUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        transInput.value = e.target.result;
        translate();
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
