<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TernTranslator | Local Code Migration Tool</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            studio_bg: 'var(--bg-canvas)',       
            studio_panel: 'var(--bg-panel)',      
            studio_border: 'var(--border-color)',    
            studio_editor: 'var(--bg-editor)',   
            t_text: 'var(--text-main)',
            t_subtext: 'var(--text-sub)',
            t_teal: '#00d4aa',
            t_teal_dim: 'var(--teal-dim)',
            t_blue: '#4a9eff',
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      /* State -1: Light Mode */
      --bg-canvas: #F8FAFC;
      --bg-panel: #FFFFFF;
      --border-color: #CBD5E1;
      --bg-editor: #F1F5F9;
      --text-main: #0F172A;
      --text-sub: #1E293B; /* High contrast, no weak greys */
      --teal-dim: rgba(0, 212, 170, 0.15);
    }
    
    .dark {
      /* State +1: Dark Mode */
      --bg-canvas: #0C1322;
      --bg-panel: #111622;
      --border-color: #1E2536;
      --bg-editor: #05070A;
      --text-main: #FFFFFF;
      --text-sub: #F8FAFC; /* Bright off-white, purged the grey */
      --teal-dim: rgba(0, 212, 170, 0.15);
    }

    body {
      background-color: var(--bg-canvas);
      background-image: radial-gradient(var(--border-color) 1.5px, transparent 1.5px);
      background-size: 24px 24px;
      color: var(--text-main);
      transition: background-color 0.2s ease, color 0.2s ease;
    }
    
    .glass-panel {
      background: var(--bg-panel);
      border: 1px solid var(--border-color);
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.3);
      transition: background-color 0.2s ease, border-color 0.2s ease;
    }

    .editor-pane {
      background: var(--bg-editor);
      box-shadow: inset 0 2px 15px rgba(0, 0, 0, 0.1);
      transition: background-color 0.2s ease;
    }
    .dark .editor-pane {
      box-shadow: inset 0 2px 15px rgba(0, 0, 0, 0.8);
    }

    textarea:focus { outline: none; }
    
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
    
    .btn-glow:hover {
      box-shadow: 0 0 15px rgba(0, 212, 170, 0.3);
      background: rgba(0, 212, 170, 0.1);
    }
  </style>
</head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

  <div class="max-w-7xl w-full">
    <header class="text-center mb-10 relative">
      <div class="absolute right-0 top-0">
        <button id="theme-toggle" class="p-2 rounded-md border border-studio_border bg-studio_panel text-t_text hover:text-t_teal transition-colors">
          <svg class="w-5 h-5 hidden dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
          <svg class="w-5 h-5 block dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path></svg>
        </button>
      </div>
      <div class="inline-block px-3 py-1 mb-4 rounded-full border border-studio_border bg-studio_panel font-mono text-t_teal text-[10px] tracking-widest uppercase shadow-sm">
        Local Tool &middot; Ternary Intelligence Stack
      </div>
      <h1 class="text-4xl md:text-5xl font-bold text-t_text mb-3 tracking-tight">
        Tern<span class="text-t_teal">Translator</span>
      </h1>
      <p class="text-t_subtext text-sm md:text-base">Migrate binary logic to balanced ternary syntax instantly.</p>
    </header>

    <div class="glass-panel rounded-xl overflow-hidden flex flex-col">
      
      <div class="flex flex-col md:flex-row border-b border-studio_border bg-studio_panel px-5 py-3 items-center justify-between gap-4">
        
        <div class="flex items-center gap-4 w-full md:w-auto">
          <div class="flex items-center gap-2">
            <div class="w-2 h-2 rounded-full bg-t_teal animate-pulse"></div>
            <span class="text-t_text font-mono text-[13px] uppercase tracking-widest">Source Engine</span>
          </div>
          <select id="trans-lang" class="bg-studio_editor border border-studio_border text-t_text focus:text-t_teal focus:border-t_teal transition-colors font-mono text-[15px] px-3 py-1.5 rounded-md outline-none cursor-pointer">
            <option value="python">Python</option>
            <option value="rust">Rust</option>
            <option value="java">Java</option>
            <option value="cpp">C++</option>
            <option value="javascript">JavaScript</option>
          </select>
          
          <div class="h-4 w-px bg-studio_border hidden md:block"></div>
          
          <label class="cursor-pointer flex items-center gap-2 text-t_text hover:text-t_blue transition-colors font-mono text-[15px] group">
            <svg class="w-5 h-5 transition-colors" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <span>Upload</span>
            <input type="file" id="trans-upload" class="hidden" accept=".py,.rs,.java,.cpp,.js,.ts,.html">
          </label>
        </div>

        <button id="trans-run-btn" class="w-full md:w-auto flex items-center justify-center gap-2 px-6 py-2 border border-t_teal/50 text-t_teal font-mono text-[15px] font-bold uppercase tracking-wider rounded-md transition-all btn-glow bg-t_teal_dim">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
          Translate Output
        </button>
      </div>

      <div class="grid md:grid-cols-2 h-[550px] divide-y md:divide-y-0 md:divide-x divide-studio_border">
        
        <div class="flex flex-col relative group">
          <div class="absolute top-3 right-4 font-mono text-[13px] text-t_subtext uppercase tracking-widest z-10 select-none">Input // Binary</div>
          <textarea id="trans-input" class="editor-pane flex-1 w-full p-5 pt-12 font-mono text-[17px] text-t_subtext resize-none" spellcheck="false" placeholder="// Paste standard binary architecture here..."></textarea>
        </div>
        
        <div class="flex flex-col relative">
          <div class="absolute top-3 right-4 font-mono text-[13px] text-t_teal uppercase tracking-widest z-10 select-none">Output // Ternary</div>
          <div id="trans-output" class="editor-pane flex-1 w-full p-5 pt-12 font-mono text-[17px] text-t_teal overflow-auto whitespace-pre"></div>
        </div>
        
      </div>

      <div class="bg-studio_panel border-t border-studio_border p-5">
        <div class="flex items-center gap-2 mb-3">
          <svg class="w-4 h-4 text-t_blue" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
          <h4 class="text-t_text font-mono text-[13px] uppercase tracking-widest">Topology Insights</h4>
        </div>
        <div id="trans-insight" class="flex flex-wrap gap-2 text-[15px] text-t_subtext">
          <div class="px-3 py-1.5 bg-studio_editor border border-studio_border rounded font-mono">Awaiting logic vectors...</div>
        </div>
      </div>
    </div>

    <footer class="mt-8 text-center text-t_subtext font-mono text-[10px] uppercase tracking-[0.2em]">
      &copy; 2026 RFI-IRFOS &middot; Balanced Ternary Systems &middot; v2.0.0
    </footer>
  </div>

  <script>
    // Theme Toggle Logic
    const themeToggle = document.getElementById('theme-toggle');
    const htmlElement = document.documentElement;
    
    themeToggle.addEventListener('click', () => {
      htmlElement.classList.toggle('dark');
    });

    const transInput = document.getElementById('trans-input');
    const transOutput = document.getElementById('trans-output');
    const transInsight = document.getElementById('trans-insight');
    const transBtn = document.getElementById('trans-run-btn');
    const transUpload = document.getElementById('trans-upload');

    const TERN_RULES = [
      { regex: /bool/g, repl: 'trit', note: 'Mapped binary bool to triadic trit.' },
      { regex: /true/g, repl: 'affirm', note: 'Mapped true to +1 (affirm).' },
      { regex: /false/g, repl: 'reject', note: 'Mapped false to -1 (reject).' },
      { regex: /None|null|undefined/g, repl: 'tend', note: 'Mapped null/empty to 0 (tend).' },
      { regex: /if\s*\((.*)\)\s*\{/g, repl: 'match $1 {', note: 'Converted if-statement to exhaustive match block.' },
      { regex: /if\s+(.*):/g, repl: 'match $1 {', note: 'Python-style if converted to match.' },
      { regex: /else\s*\{|else:/g, repl: 'tend => { // auto-injected safety hold\n    }\n    reject => {', note: 'Injected state 0 (tend) for logic exhaustiveness.' },
      { regex: /return\s+1|return\s+True/gi, repl: 'return affirm', note: 'Normalised positive return.' },
      { regex: /return\s+0|return\s+False/gi, repl: 'return reject', note: 'Normalised negative return.' },
      { regex: /void|def|fn/g, repl: 'fn', note: 'Unified function declaration.' },
    ];

    function translate() {
      let code = transInput.value;
      if (!code.trim()) return;

      transBtn.disabled = true;
      transBtn.innerHTML = '<svg class="w-5 h-5 animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg> Parsing...';
      
      const insights = new Set();
      let translated = code;

      TERN_RULES.forEach(rule => {
        if (rule.regex.test(translated)) {
          translated = translated.replace(rule.regex, rule.repl);
          insights.add(rule.note);
        }
      });

      if (!translated.includes('fn main')) {
        translated = "// Translated via Ternlang BET VM Protocol\n\n" + translated;
      }

      setTimeout(() => {
        transOutput.textContent = translated;
        
        if (insights.size > 0) {
          transInsight.innerHTML = Array.from(insights).map(note => 
            `<div class="px-3 py-1.5 bg-studio_editor border border-studio_border rounded flex items-center gap-2">
              <span class="w-1.5 h-1.5 rounded-full bg-t_teal"></span>
              <span class="text-t_text font-mono text-[13px]">${note}</span>
            </div>`
          ).join('');
        } else {
          transInsight.innerHTML = `<div class="px-3 py-1.5 bg-studio_editor border border-studio_border rounded font-mono text-[13px] text-t_text">System baseline logic detected. No triadic morphing required.</div>`;
        }
        
        transBtn.disabled = false;
        transBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg> Translate Output';
        transOutput.scrollTop = 0;
      }, 400);
    }

    transBtn.addEventListener('click', translate);

    transUpload.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => {
        transInput.value = e.target.result;
        translate();
      };
      reader.readAsText(file);
    });
  </script>
</body>
</html>
